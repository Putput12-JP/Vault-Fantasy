<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#1A1A1A" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#FAFAFA" media="(prefers-color-scheme: light)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Geist+Mono:wght@500;600&family=Geist:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="sv2.css?v=5">
<script>try{if(/[?&]embed=1/.test(location.search))document.documentElement.classList.add('sv2-embed')}catch(e){}</script>
<script>
/* first paint: theme and skin before the body renders. Every storage access is guarded; the page works without storage.
   Theme: sv2-theme (dark, light, system), else the app's vault-appearance (light maps to light, anything else to dark),
   else no override, so prefers-color-scheme decides. Skin: sv2-skin (default or apple). */
(function () {
  var d = document.documentElement;
  function get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  var t = get('sv2-theme'), a = get('vault-appearance');
  if (t !== 'dark' && t !== 'light' && t !== 'system') t = a ? (a === 'light' ? 'light' : 'dark') : 'system';
  if (t !== 'system') d.setAttribute('data-theme', t);
  if (get('sv2-skin') === 'apple') d.setAttribute('data-sv2-skin', 'apple');
})();
</script>
</head>

        </button>
        <button type="button" class="sv2-ibtn sv2-rf sv2-press sv2-press-btn" id="sv2-refresh" data-state="idle" aria-label="Refresh">

          <span class="sv2-spinner xs" aria-hidden="true"></span>
          <span class="sv2-rf-t">Refresh</span>
        </button>
        <button type="button" class="sv2-ibtn sv2-press sv2-press-btn" id="sv2-menu-btn" aria-expanded="false" aria-controls="sv2-menu" aria-label="Theme and style">
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M4 8h16M4 16h16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="9" cy="8" r="2.4" fill="var(--sv2-page)" stroke="currentColor" stroke-width="2"/><circle cx="15" cy="16" r="2.4" fill="var(--sv2-page)" stroke="currentColor" stroke-width="2"/></svg>
        </button>

    </div>

      <p class="sv2-guard" id="sv2-guard" role="status" hidden></p>
    </div>
    <div class="sv2-info" id="sv2-info" role="region" aria-label="How to read this" hidden></div>
  </div>
  <div class="sv2-menu" id="sv2-menu" role="group" aria-label="Theme and style" hidden>
    <div>
      <h2 class="sv2-h2">Theme</h2>
