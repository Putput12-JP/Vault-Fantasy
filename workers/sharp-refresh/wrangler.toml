name = "sharp-refresh"
main = "src/index.js"
compatibility_date = "2026-09-01"

# Every 10 minutes, UTC. The workflow's own gate decides whether a run is worth doing
# (busy windows every 10 min, otherwise every 30 min, nothing overnight).
# The same */10 tick also starts the price-feed workflows on their old schedules (src/price-jobs.js):
# nfl-book-tape, update-props, update-prop-history, update-game-history, update-kalshi, update-polymarket,
# update-line-history and update-lineup. Their GitHub schedule: triggers are removed, so this Worker is their only clock.
# No new cron triggers: the free plan allows 5 per account, and sharp-refresh (2) + nba-refresh (2) already use 4.
# Set PRICE_JOBS = "off" under [vars] to stop the price jobs without touching the Sharp Money dispatch.
[triggers]
crons = ["*/10 * * * *", "*/2 * * * *"]

[[durable_objects.bindings]]
name = "GATE"
class_name = "Gate"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Gate"]

[vars]
REPO = "Putput12-JP/Vault-Fantasy"
WORKFLOW = "update-sharp-money.yml"
# Also started (at most once per 45 min) by a Refresh click, for the US-books prices. Remove this line to turn that off.
LINEUP_WORKFLOW = "update-lineup.yml"
REF = "main"
# Refresh button. TURNSTILE_SITEKEY is public (served by GET /sitekey).
# Widget covers vaultfantasy.com and www.vaultfantasy.com.
# Set the secret before or together with deploy:
#   wrangler secret put TURNSTILE_SECRET
# POST stays fail-closed (503) until TURNSTILE_SECRET is set.
TURNSTILE_SITEKEY = "0x4AAAAAAFVz_fytDiRKCiAo"
# Kalshi-vs-books gap alerts: dispatched every 2 min in the NFL busy windows (the */2 cron above). Remove this line to turn it off.
KB_WORKFLOW = "update-kb-gaps.yml"
# GITHUB_TOKEN is a secret: `wrangler secret put GITHUB_TOKEN`
