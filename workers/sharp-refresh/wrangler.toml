name = "sharp-refresh"
main = "src/index.js"
compatibility_date = "2026-09-01"

# Every 10 minutes, UTC. The workflow's own gate decides whether a run is worth doing
# (busy windows every 10 min, otherwise every 30 min, nothing overnight).
[triggers]
crons = ["*/10 * * * *", "*/2 * * * *"]

# Refresh button. TURNSTILE_SITEKEY is public. The secret is not a var:
#   wrangler secret put TURNSTILE_SECRET
# The site key is set under [vars] below (widget covers vaultfantasy.com and www.vaultfantasy.com).
# POST stays fail-closed (503) until the secret and the Gate binding both exist.

[[durable_objects.bindings]]
name = "GATE"
class_name = "Gate"

[[migrations]]
tag = "v1"
new_classes = ["Gate"]

[vars]
REPO = "Putput12-JP/Vault-Fantasy"
WORKFLOW = "update-sharp-money.yml"
# Also started (at most once per 45 min) by a Refresh click, for the US-books prices. Remove this line to turn that off.
LINEUP_WORKFLOW = "update-lineup.yml"
REF = "main"
# Public Turnstile site key for the Refresh button (served by GET /sitekey).
TURNSTILE_SITEKEY = "0x4AAAAAAFVz_fytDiRKCiAo"
# Kalshi-vs-books gap alerts: dispatched every 2 min in the NFL busy windows (the */2 cron above). Remove this line to turn it off.
KB_WORKFLOW = "update-kb-gaps.yml"
# GITHUB_TOKEN is a secret: `wrangler secret put GITHUB_TOKEN`
