# Sharp Money page (vaultfantasy.com/sharp-money/): polls Pinnacle, Action Network,
# Polymarket and Kalshi, then rewrites data.json + state.json on the `sharp-data`
# branch. The page reads data.json from that branch, so nothing is republished
# and no Claude usage is involved. The branch is force-pushed as ONE commit so
# the ~2MB state file never piles up in history.
name: Update Sharp Money

on:
  workflow_dispatch:
    inputs:
      force:
        description: 'Run even outside the busy windows'
        type: boolean
        default: true
  schedule:
    - cron: '3,13,23,33,43,53 * * * *'

concurrency:
  group: sharp-money
  cancel-in-progress: false
permissions:
  contents: write
  actions: write   # start the Kalshi-vs-books gap loop

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      # Busy windows (Central): Mon/Thu 5-11pm, Sat 10am-11pm, Sun 8am-8pm every
      # 10 min; other days 9am-11pm every 30 min. Quiet hours are skipped.
      - name: Gate
        id: gate
        run: |
          export TZ=America/Chicago
          d=$(date +%u); h=$(date +%-H); m=$(date +%-M); go=0
          case "$d" in
            1|4) [ "$h" -ge 17 ] && [ "$h" -le 23 ] && go=1 ;;
            6)   [ "$h" -ge 10 ] && [ "$h" -le 23 ] && go=1 ;;
            7)   [ "$h" -ge 8 ]  && [ "$h" -le 20 ] && go=1 ;;
          esac
          if [ "$go" = 0 ] && [ "$h" -ge 9 ] && [ "$h" -le 23 ] && { [ "$m" -lt 10 ] || { [ "$m" -ge 30 ] && [ "$m" -lt 40 ]; }; }; then go=1; fi
          [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.event.inputs.force }}" != "false" ] && go=1
          echo "go=$go" >> "$GITHUB_OUTPUT"
      # Keep the Kalshi-vs-books gap loop (update-kb-gaps.yml) running: each loop run lasts ~9 min and this fires every 10, so the next
      # one is always queued behind it. The loop gates itself to the NFL windows. Never blocks this job.
      - name: Start gap loop
        if: steps.gate.outputs.go == '1'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run update-kb-gaps.yml --ref main --repo "${{ github.repository }}"
      - uses: actions/checkout@v5
        if: steps.gate.outputs.go == '1'
      - uses: actions/setup-node@v5
        if: steps.gate.outputs.go == '1'
        with:
          node-version: 20
      - name: Load previous state
        if: steps.gate.outputs.go == '1'
        run: |
          mkdir -p sharp-out
          if git ls-remote --exit-code --heads origin sharp-data >/dev/null 2>&1; then
            git fetch --depth=1 origin sharp-data
            git show FETCH_HEAD:state.json > sharp-out/state.json || true
            git show FETCH_HEAD:novig_props.json > sharp-out/novig_props.json || true
            git show FETCH_HEAD:prop_plays.json > sharp-out/prop_plays.json || true
            # The tape is the only copy of the close history: if it exists on the branch it must load (a failed read fails the job
            # instead of starting an empty tape that would then be published over it).
            if git cat-file -e FETCH_HEAD:prop_close_tape.json 2>/dev/null; then git show FETCH_HEAD:prop_close_tape.json > sharp-out/prop_close_tape.json; fi
            git show FETCH_HEAD:ev_alert_history.json > sharp-out/ev_alert_history.json || rm -f sharp-out/ev_alert_history.json
            # Rows parked by a run that found the history file broken; build_ev_history.py folds them in and deletes them.
            for p in $(git ls-tree --name-only FETCH_HEAD | grep -E '^ev_alert_history\.pending.*\.json$' || true); do
              git show "FETCH_HEAD:$p" > "sharp-out/$p" || true
              [ -s "sharp-out/$p" ] || rm -f "sharp-out/$p"
            done
          fi
      # The book feed (PrizePicks / Underdog / Sleeper / Pinnacle props) and the Kalshi prop fairs normally come from update-props.yml,
      # which rides GitHub's own cron and has been landing 4-7 hours apart. A +EV call against a Pinnacle line that old is a phantom
      # (the line has moved), so pull both here, on the Cloudflare-driven cadence. ~10s, keyless, never blocks the poll.
      - name: Refresh book lines + Kalshi props
        if: steps.gate.outputs.go == '1'
        continue-on-error: true
        run: |
          cp data/lineup-feed.json sharp-out/lineup-feed.json
          node scripts/fetch-pickem-props.mjs --feed=sharp-out/lineup-feed.json || true
          node scripts/fetch-kalshi-props.mjs --out=sharp-out/kalshi_props.json || true
      # Novig player-prop order books (keyless). Time-boxed and oldest-read-first, so a
      # big slate is covered over a few runs; rows older than an hour drop out.
      - name: Poll Novig props
        if: steps.gate.outputs.go == '1'
        continue-on-error: true
        # A Refresh click dispatches with force=true: keep that run short (45s of props, hot props first), the scheduled runs do the long sweep.
        run: |
          B=200; [ "${{ github.event.inputs.force }}" = "true" ] && B=45
          node scripts/fetch-novig-props.mjs --out=sharp-out/novig_props.json --budget=$B
      # Prop close tape: every book's last read before kickoff (Pinnacle, FanDuel, DraftKings, ..., Kalshi, Novig), so each
      # book's close can be scored on its own (scripts/compare_prop_closes.py). Reads the three files fetched above, no new
      # calls. continue-on-error: a failure here never blocks the poll. A tape that exists but does not parse stops the step
      # without overwriting it, and the old file is republished unchanged.
      - name: Record prop closes
        if: steps.gate.outputs.go == '1'
        continue-on-error: true
        run: |
          python3 scripts/build_prop_close_tape.py --feed=sharp-out/lineup-feed.json --kalshi=sharp-out/kalshi_props.json --novig=sharp-out/novig_props.json --tape=sharp-out/prop_close_tape.json
      - name: Poll sources
        if: steps.gate.outputs.go == '1'
        run: |
          Q=""; [ "${{ github.event.inputs.force }}" = "true" ] && Q="--quick"
          node scripts/fetch-sharp-money.mjs --dir=sharp-out $Q
      # College football and NBA line tape (scripts/sharp_tape.py): every book's numbers, appended when they change, read from the
      # data.json just built (teams are already matched there). Committed to main like the NFL tape. Never blocks the publish.
      - name: Record CFB and NBA line tape
        if: steps.gate.outputs.go == '1'
        continue-on-error: true
        run: |
          python3 scripts/sharp_tape.py --data sharp-out/data.json
          git config user.name  "vault-bot"
          git config user.email "vault-bot@users.noreply.github.com"
          git add data/book_tape/cfb data/book_tape/nba
          if git diff --staged --quiet; then echo "No line changes."; else
            git commit -q -m "data: CFB and NBA line tape [skip ci]"
            git pull --rebase --autostash origin main || true
            git push origin HEAD:main
          fi
      # Permanent graded +EV log. data.json keeps only the newest 1500 alerts, so graded ones age out; this file never drops an entry.
      # Published next to data.json. Never blocks the publish: on failure the previous file is carried forward untouched.
      - name: Append graded +EV alerts to history
        id: evhist
        if: steps.gate.outputs.go == '1'
        continue-on-error: true
        run: |
          python3 scripts/build_ev_history.py --history sharp-out/ev_alert_history.json --data sharp-out/data.json
      - name: Publish to sharp-data
        if: steps.gate.outputs.go == '1'
        run: |
          cd sharp-out || exit 1
          rm -f new_alerts.json
          git init -q -b sharp-data
          git config user.name  "vault-bot"
          git config user.email "vault-bot@users.noreply.github.com"
          git add data.json state.json summary.json alerts.json accounts.json props.json reads.json
          if [ -f novig_props.json ]; then git add novig_props.json; fi
          if [ -f prop_plays.json ]; then git add prop_plays.json; fi
          if [ -f prop_close_tape.json ]; then git add prop_close_tape.json; fi
          if [ -f ev_alert_history.json ]; then git add ev_alert_history.json; fi
          # The publish dir is rebuilt as one fresh commit, so a pending file merged this run (deleted from sharp-out) simply drops off the branch.
          if compgen -G "ev_alert_history.pending*.json" > /dev/null; then git add ev_alert_history.pending*.json; fi
          if compgen -G "g/*.json" > /dev/null; then git add g/*.json; fi
          git commit -q -m "sharp money: $(date -u +%FT%TZ) [skip ci]"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" sharp-data
      # The history step is continue-on-error so a bad history file never blocks the publish. Fail the run AFTER publishing so it is still visible.
      - name: Fail the run if the +EV history was broken
        if: steps.evhist.outcome == 'failure'
        run: |
          echo "::error::ev_alert_history.json was broken; new graded rows were parked in ev_alert_history.pending*.json on sharp-data. Repair the history file, the next run merges them."
          exit 1
