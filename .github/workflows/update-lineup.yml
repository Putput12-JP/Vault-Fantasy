# Refresh the Lineup Command projection feed (also pulls ParlayAPI game odds +
# player props). In-season: a daily baseline, the Tue–Fri opening window when
# props post, and the Sun/Mon/Thu pregame windows, inside the free credit
# budget (see below). Offseason:
# once daily. Matches the repo's scripts/ + data/ + workflows pattern.
# Place at: .github/workflows/update-lineup.yml

name: Update Lineup projections

on:
  schedule:
    # ── ParlayAPI credit budget ──────────────────────────────────────────
    # Each run costs 6 ParlayAPI credits: 2 requests (/odds + /props) billed
    # at 3 credits each. Measured over Jul 2026 — 140 runs → 840 credits,
    # exactly 6.0/run. The FREE tier is 1,000 credits/month, so every month
    # must fit inside ~166 runs. This whole schedule is sized to stay under
    # that cap year-round, so the free plan is enough — no upgrade needed.
    #
    # OFFSEASON (Feb–Aug) — once daily. ~30 runs ≈ 180 credits/month.
    # In preseason ParlayAPI /props returns empty until books post player
    # props; the free keyless PrizePicks workflow (update-props.yml) fills
    # vegas_player_props in the meantime, and build-lineup-feed automatically
    # swaps in the real ParlayAPI books the moment /props starts returning them.
    - cron: '0 9 * 2,3,4,5,6,7,8 *'
    #
    # IN-SEASON (Sep–Jan) — rebalanced 2026-09-28 toward the OPENING WINDOW,
    # still inside the free tier. Vault's evidence (reports/NFL prediction
    # model upgrade.md; the Vault's Plays record) is that picks win at the
    # number they post at and give much of it back by the close, and props
    # open Tue–Fri. The old schedule fetched only once a day (08 UTC = 3-4am
    # ET) Tue/Wed/Fri/Sat and spent 29 of its 36 weekly runs in game windows.
    # Same 36 runs/week, moved:
    #   daily baseline (all days)          08 UTC                        7
    #   Tue / Wed / Fri opening window     13, 17, 21 UTC  (9a/1p/5p ET) +9
    #   Sat (Sunday props settle)          16 UTC                        +1
    #   Thu (openers + TNF pregame)        14,16,18,20,22,23 UTC         +6
    #   Sunday pregame / between windows   13,14,15,16,18,19,20,22,23    +9
    #   Mon (MNF pregame)                  17, 19, 21, 23 UTC            +4
    # Closing prices still land within ~1h of each kickoff (16:00 before the
    # 1pm ET slate, 20:00 before 4:05/4:25, 23:00 before SNF/TNF/MNF). Checked
    # per month for Sep 2026 – Jan 2028: 152–161 runs = 912–966 credits (the
    # old schedule hit 167 = 1,002 in Jan 2028).
    - cron: '0 8 * 9,10,11,12,1 *'
    - cron: '0 13,17,21 * 9,10,11,12,1 2,3,5'
    - cron: '0 16 * 9,10,11,12,1 6'
    - cron: '0 14,16,18,20,22,23 * 9,10,11,12,1 4'
    - cron: '0 13,14,15,16,18,19,20,22,23 * 9,10,11,12,1 0'
    - cron: '0 17,19,21,23 * 9,10,11,12,1 1'
  workflow_dispatch: {}        # manual "Run workflow" button

# Adjacent hourly pregame-window runs (and a manual workflow_dispatch) can
# overlap on data/lineup-feed.json. Serialize so they can't race and trip the
# push retry loop below. (Git-safety only, not a credit saving — a queued run
# still executes and still costs its 6 credits.)
concurrency:
  group: lineup-feed
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build projection feed
        run: |
          node scripts/build-lineup-feed.mjs
        env:
          # Optional: live Vegas team totals via The Odds API (markets=spreads,totals).
          # Add repo secret ODDS_API_KEY to enable. Without it, Vegas falls back to
          # ESPN's free scoreboard, then to the preseason workbook baseline.
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          # Optional: weekly PLAYER PROPS + game lines via ParlayAPI (or The Odds API).
          # ParlayAPI provides BOTH game odds and props from one key — when set, the
          # feed routes everything through it (10+ books incl. DFS). Dormant if unset.
          #   ParlayAPI (recommended): set PROPS_API_KEY only — host defaults to
          #     parlay-api.com (v1 base, X-API-Key header, flat /props endpoint).
          #   The Odds API instead:    set PROPS_API_HOST=api.the-odds-api.com
          PROPS_API_KEY: ${{ secrets.PROPS_API_KEY }}
          # PARLAY_API_KEY accepted as an alias so either secret name works.
          PARLAY_API_KEY: ${{ secrets.PARLAY_API_KEY }}
          PROPS_API_HOST: ${{ vars.PROPS_API_HOST }}
      - name: Grade the slate (Market Grades)
        # Reads the feed just written above (slate, lines, shrunk DvP, Vegas games)
        # plus nflverse snaps/stats → data/market_grades.json. Pure stdlib, no deps.
        # Non-fatal: a grade failure must not block the feed commit below.
        run: |
          python3 scripts/build_market_grades.py || echo "market grades build failed — keeping previous grades"
      - name: Commit refreshed feed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/lineup-feed.json
          git add data/market_grades.json 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "No change in feed."
          else
            git commit -m "data: refresh Lineup projections feed + Market Grades"
            # Rebase on the latest main before pushing so overlapping/re-run jobs
            # never fail with "fetch first" (remote moved ahead). Retry once.
            for i in 1 2 3; do
              git pull --rebase --autostash origin main && git push && break
              echo "push race, retrying ($i)…"; sleep 3
            done
          fi
