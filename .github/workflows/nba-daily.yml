# NBA daily refresh: box scores, rosters, projections, game logs and the prop model's state, then the app page.
#
# Everything the Minutes Lab and Player Props pages read that changes day to day during the season:
#   fetch_hoopr.py            box scores + schedules (sportsdataverse, rebuilt nightly in season)
#   fetch_depth_charts.py     current rosters and depth charts (ESPN)
#   build_player_projections  default minutes (follow this season's minutes once games are played) and rates
#   build_gamelogs            per-player game logs: L5 / L10 / L20 / season / H2H hit rates
#   build_model_state         prop model v2 inputs: defense by position, pace, scoring, shooting, minutes swing
#   prop_board, build_data_health   refresh the page's snapshots, then re-render nba/projections.html
# Model REFITS (build_prop_model_v2.py) need the local price archive and stay manual.
name: NBA daily refresh

on:
  workflow_dispatch: {}
  schedule:
    - cron: '23 11 * * *'     # 7:23 AM ET, after the overnight box scores land

concurrency:
  group: nba-daily
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Box scores and schedules
        run: |
          Y=$(date -u +%Y); M=$(date -u +%m)
          CUR=$(( 10#$M >= 8 ? Y + 1 : Y ))        # season label = the year it ends
          python3 nba/scripts/fetch_hoopr.py $((CUR-3)) $((CUR-2)) $((CUR-1)) $CUR

      - name: Rosters and depth charts
        run: python3 nba/scripts/fetch_depth_charts.py

      - name: Projections, game logs, model state
        run: |
          python3 nba/scripts/build_player_projections.py
          python3 nba/scripts/build_gamelogs.py
          python3 nba/scripts/build_model_state.py

      - name: Player photos and team logos
        run: python3 nba/scripts/fetch_photos.py      # only new players are downloaded; embedded in the page

      - name: Page snapshots
        run: |
          python3 nba/scripts/prop_board.py
          python3 nba/scripts/build_data_health.py

      - name: Commit if changed
        run: |
          git config user.name  "vault-bot"
          git config user.email "vault-bot@users.noreply.github.com"
          git add nba/data nba/projections.html
          if git diff --cached --quiet; then echo "Nothing changed."; exit 0; fi
          git commit -q -m "nba: daily refresh $(date -u +%Y-%m-%d) [skip ci]"
          for i in 1 2 3 4; do
            git pull -q --rebase && git push -q && exit 0
            sleep $((i * 5))
          done
          echo "push failed" && exit 1
