# NFL sportsbook tape: every book's moneyline, main spread and total, appended only when it changes
# (scripts/book_tape.py -> data/book_tape/nfl/). Free, keyless: Action Network's scoreboard and Pinnacle's guest API.
# Feeds the declared Polymarket vs sportsbooks re-test (docs/pm-vs-books-test.md, weeks 4-7), which needs book
# prices far more often than the lineup feed fetches them. GitHub may skip some scheduled runs; each run that
# lands records whatever changed since the last one.
name: NFL book tape

on:
  workflow_dispatch: {}
  # No schedule: here on purpose. GitHub's scheduler fired this every 4-7 hours, so the sharp-refresh Cloudflare Worker
  # (workers/sharp-refresh/src/price-jobs.js) starts it with workflow_dispatch on the same UTC schedule: */20 * * * *

concurrency:
  group: nfl-book-tape
  cancel-in-progress: false
permissions:
  contents: write

jobs:
  tape:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Record changed lines
        run: python3 scripts/book_tape.py
      - name: Commit if changed
        run: |
          git config user.name  "vault-bot"
          git config user.email "vault-bot@users.noreply.github.com"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
          git add data/book_tape/
          if git diff --staged --quiet; then
            echo "No line changes."
          else
            git commit -m "data: NFL book tape [skip ci]"
            # Rebase on the latest main before pushing so jobs started on the same tick
            # never fail with "fetch first" / "cannot lock ref". Retry, then fail loudly.
            pushed=0
            for i in 1 2 3; do
              if git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && git push; then pushed=1; break; fi
              # A conflicting rebase stops half-way: abort it so the next try (and the runner) starts clean.
              if [ -d "$(git rev-parse --git-path rebase-merge)" ] || [ -d "$(git rev-parse --git-path rebase-apply)" ]; then
                git rebase --abort || true
              fi
              echo "push race, retrying ($i)..."; sleep 3
            done
            if [ "$pushed" != 1 ]; then
              echo "::error::git push failed after 3 tries; this run's data was NOT published."
              exit 1
            fi
          fi
