# Pulls NFL game-winner prices from Kalshi (regulated prediction exchange) into
# data/prediction_markets.json — a second, independent implied probability the
# Betting Game Markets Edge Board cross-checks against the sportsbook fair.
# Keyless and free — no secrets, no credits (unlike the ParlayAPI lineup feed).
name: Update Kalshi markets

on:
  workflow_dispatch: {}          # run manually any time from the Actions tab
  # No schedule: here on purpose. GitHub's scheduler fired this every 4-7 hours, so the sharp-refresh Cloudflare Worker
  # (workers/sharp-refresh/src/price-jobs.js) starts it with workflow_dispatch on the same UTC schedule: 37 * * * *
  # Hourly, year-round. Kalshi prices move through the day; the job only
  # commits when the file actually changed, so quiet hours are free. Off the
  # top of the hour (:37) since that slot is less congested on GitHub.

concurrency:
  group: kalshi-feed
  cancel-in-progress: false
permissions:
  contents: write

jobs:
  kalshi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: Fetch Kalshi NFL game markets
        run: node scripts/fetch-kalshi.mjs --out=data/prediction_markets.json

      - name: Commit if changed
        run: |
          if git diff --quiet -- data/prediction_markets.json; then
            echo "No Kalshi changes."
          else
            git config user.name  "vault-bot"
            git config user.email "vault-bot@users.noreply.github.com"
            git add data/prediction_markets.json
            git commit -m "kalshi: refresh NFL game markets [skip ci]"
            # Rebase on the latest main before pushing so overlapping jobs
            # never fail with "fetch first" (remote moved ahead). Retry a few times.
            pushed=0
            for i in 1 2 3; do
              if git pull --rebase --autostash origin main && git push; then pushed=1; break; fi
              # A conflicting rebase stops half-way: abort it so the next try (and the runner) starts clean.
              if [ -d "$(git rev-parse --git-path rebase-merge)" ] || [ -d "$(git rev-parse --git-path rebase-apply)" ]; then
                git rebase --abort || true
              fi
              echo "push race, retrying ($i)..."; sleep 3
            done
            if [ "$pushed" != 1 ]; then
              echo "::error::git push failed after 3 tries; this run's data was NOT published."
              exit 1
            fi
          fi
