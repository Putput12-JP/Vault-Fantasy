# Guards the price-feed schedule that lives in the sharp-refresh Cloudflare Worker (workers/sharp-refresh/src/price-jobs.js):
# the migrated workflows must carry no GitHub schedule: trigger (they would double-run), and the Worker must keep their old crons
# and the update-lineup ParlayAPI credit cap.
name: Test sharp-refresh price jobs

on:
  pull_request:
    paths:
      - 'workers/sharp-refresh/**'
      - 'tests/sharp_refresh_price_jobs.test.mjs'
      - '.github/workflows/nfl-book-tape.yml'
      - '.github/workflows/update-props.yml'
      - '.github/workflows/update-prop-history.yml'
      - '.github/workflows/update-game-history.yml'
      - '.github/workflows/update-kalshi.yml'
      - '.github/workflows/update-polymarket.yml'
      - '.github/workflows/update-line-history.yml'
      - '.github/workflows/update-lineup.yml'
  workflow_dispatch: {}

concurrency:
  group: test-sharp-refresh-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
      - name: Price-job schedule tests
        run: node --test tests/sharp_refresh_price_jobs.test.mjs
