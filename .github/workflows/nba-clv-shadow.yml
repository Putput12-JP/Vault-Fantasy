# Closing-line shadow (docs/clv-shadow.md): rebuilds nba/data/clv_shadow.json from the recorded Props Simulation rows on the
# `nba-data` branch. Read-only on nba-data (only the psim and meta files are checked out); nothing here prices or bets.
# Its own workflow so it never edits nba-daily.yml.
name: NBA closing-line shadow

on:
  schedule:
    - cron: '41 12 * * *'     # 7:41 AM CT, after the overnight settle
  workflow_dispatch:

concurrency:
  group: nba-clv-shadow
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          ref: nba-data
          path: nba-data
          sparse-checkout: |
            snapshots/*/psim.jsonl
            snapshots/*/meta.jsonl
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build the shadow record
        run: python3 -I nba/scripts/clv_shadow.py --dir=nba-data
      - name: Commit if changed
        run: |
          git config user.name  "vault-bot"
          git config user.email "vault-bot@users.noreply.github.com"
          git add nba/data/clv_shadow.json
          if git diff --cached --quiet; then echo "Nothing changed."; exit 0; fi
          git commit -q -m "nba: closing-line shadow $(date -u +%Y-%m-%d) [skip ci]"
          for i in 1 2 3 4; do
            git pull -q --rebase && git push -q && exit 0
            sleep $((i * 5))
          done
          echo "push failed" && exit 1
