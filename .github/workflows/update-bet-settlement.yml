# Settles graded bets + computes closing-line value (CLV) from the retained
# snapshot logs. Reads data/prop_line_history.json + data/game_line_history.json
# + data/nflverse_stats_<season>.json (and nflverse games.csv for final scores)
# and rebuilds data/bet_results.json + data/edge_scoreboard.json deterministically
# each run — no append/merge, so the ledger can't drift. Pure stdlib, no credits.
# Missing inputs degrade gracefully (empty ledgers) rather than failing.
name: Settle bets + CLV

on:
  workflow_dispatch: {}
  # Primary trigger: settle the moment fresh box scores land. "Update nflverse
  # data" publishes at a VARIABLE time (nominally 06:00 UTC but often hours
  # later — Thursday-night / West-coast games regularly aren't in the nflverse
  # stats release until late morning UTC). A fixed settle clock therefore raced
  # the data and left the prior night's game unsettled for ~24h. Chaining off
  # that workflow's completion removes the guesswork: fresh data in → settle now.
  workflow_run:
    workflows: ["Update nflverse data"]
    types: [completed]
  schedule:
    # Fallback safety net, decoupled from the nflverse run: catches days the
    # chained run was skipped/failed, plus late score corrections. Kept late
    # enough that nflverse has almost always published by now.
    - cron: '10 13 * * *'

concurrency:
  group: bet-settlement
  cancel-in-progress: false
permissions:
  contents: write

jobs:
  settle:
    runs-on: ubuntu-latest
    # On the chained trigger, only run when nflverse actually succeeded; the
    # dispatch / schedule paths always run.
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Settle bets + compute CLV
        run: python3 scripts/settle_bets.py

      - name: Commit if changed
        run: |
          git config user.name  "vault-bot"
          git config user.email "vault-bot@users.noreply.github.com"
          # Rebase in case another data cron pushed while we ran.
          git pull --rebase --autostash origin ${GITHUB_REF_NAME} || true
          git add data/bet_results.json data/edge_scoreboard.json 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "No settlement changes."
          else
            git commit -m "bets: settle results + CLV scoreboard [skip ci]"
            git push
          fi
