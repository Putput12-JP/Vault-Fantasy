# Settles graded bets + computes closing-line value (CLV) from the retained
# snapshot logs. Reads data/prop_line_history.json + data/game_line_history.json
# + data/nflverse_stats_<season>.json (and nflverse games.csv for final scores)
# and rebuilds data/bet_results.json + data/edge_scoreboard.json deterministically
# each run — no append/merge, so the ledger can't drift. Pure stdlib, no credits.
# Missing inputs degrade gracefully (empty ledgers) rather than failing.
name: Settle bets + CLV

on:
  workflow_dispatch: {}
  # Primary triggers: settle the moment fresh data lands.
  #  • "Update nflverse data" — the canonical player box scores + game scores.
  #    Publishes at a VARIABLE time (nominally 06:00 UTC but often hours later —
  #    TNF / West-coast games regularly aren't in the nflverse release until late
  #    morning UTC), so a fixed settle clock raced it and left the prior night's
  #    game unsettled ~24h. This drives PROP settlement (needs nflverse stats).
  #  • "Update game history" — the hourly (:29) line snapshot. Settlement now
  #    also pulls final scores from ESPN's scoreboard (minutes after a game, vs
  #    nflverse's hours-to-a-day), so chaining here settles a finished GAME and
  #    any pick tracked on it within the hour, long before nflverse catches up.
  workflow_run:
    workflows: ["Update nflverse data", "Update game history"]
    types: [completed]
  schedule:
    # Fallback safety net, decoupled from the nflverse run: catches days the
    # chained run was skipped/failed, plus late score corrections. Kept late
    # enough that nflverse has almost always published by now.
    - cron: '10 13 * * *'
    # Game-window crons (UTC), settling GAMES directly from ESPN so a finished
    # game clears within minutes. These do NOT depend on "Update game history"
    # firing — game_line_history is banked pre-kickoff, and settle_bets pulls
    # final scores from ESPN itself. This matters because the workflow_run chain
    # above rides GitHub's `schedule` events, which GitHub throttles hardest on
    # busy Sundays (the hourly game-history cron routinely slips to every 4-6h),
    # so completed games were sitting unsettled for hours mid-slate. Redundant
    # */15 ticks across the windows give several chances for one to fire even
    # under heavy throttling; concurrency + deterministic rebuild make extra
    # runs free. nflverse still drives PROP settlement on its own trigger.
    - cron: '*/15 17-23 * * 0'   # Sun early + late afternoon windows (1pm-7pm ET)
    - cron: '*/15 0-4 * * 1'     # Sun night into Mon morning UTC (SNF)
    - cron: '*/15 0-4 * * 2'     # Mon night football spilling into Tue UTC
    - cron: '*/15 0-4 * * 5'     # Thu night football spilling into Fri UTC

concurrency:
  group: bet-settlement
  cancel-in-progress: false
permissions:
  contents: write

jobs:
  settle:
    runs-on: ubuntu-latest
    # On the chained trigger, only run when nflverse actually succeeded; the
    # dispatch / schedule paths always run.
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      # Fast player-stat feed: ESPN box scores for finished games nflverse hasn't
      # published yet, written to data/espn_player_stats_<season>.json. settle_bets
      # overlays it (nflverse wins on conflict), so PLAYER PROPS settle within
      # minutes of a final instead of waiting hours-to-a-day for nflverse — the
      # same fast-feed trick GAME bets already use off ESPN's scoreboard. The
      # frontend My Picks view reads the same overlay. Never fails the settle.
      - name: Fetch ESPN box scores (fast prop feed)
        run: python3 scripts/fetch_espn_boxscores.py || true

      - name: Settle bets + compute CLV
        run: python3 scripts/settle_bets.py

      # Post-settle retro on Vault's OWN prop projections (record, CLV, per-market
      # projection bias, model-vs-market log-loss) written to docs/retro/. Reads
      # the tape settle_bets just wrote; output is DETERMINISTIC (no wall-clock),
      # so the committed doc only changes when the numbers do and rides the
      # settlement commit below — no extra churn on quiet */15 ticks. Never fails
      # the settle.
      - name: Weekly prop retro
        run: python3 scripts/weekly_prop_retro.py || true

      - name: Commit if changed
        run: |
          git config user.name  "vault-bot"
          git config user.email "vault-bot@users.noreply.github.com"
          # Rebase in case another data cron pushed while we ran.
          git pull --rebase --autostash origin ${GITHUB_REF_NAME} || true
          git add data/bet_results.json data/edge_scoreboard.json data/espn_player_stats_*.json docs/retro/*.md 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "No settlement changes."
          else
            git commit -m "bets: settle results + CLV scoreboard [skip ci]"
            git push
          fi
