# Keeps data/cfbd/lines_<season>.json current: every college game's betting lines from CollegeFootballData, including the
# OPENING spread each book posted. The CFB model's "against the opening line" check reads it (scripts/cfb_model.py).
# Needs the repo secret CFBD_API_KEY. ~15 API calls a run, once a day, well inside the free monthly limit.
name: Update CFBD lines

on:
  workflow_dispatch: {}
  schedule:
    - cron: '41 9 * 8,9,10,11,12,1 *'

concurrency:
  group: cfbd-lines
  cancel-in-progress: false
permissions:
  contents: write

jobs:
  lines:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Fetch lines
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        run: |
          S=$(date -u -d '-60 days' +%Y)      # January still belongs to the season that started in the fall
          python3 scripts/fetch_cfbd_lines.py --years "$S-$S"
      - name: Fetch ESPN opens
        run: python3 scripts/fetch_espn_opens.py --year "$(date -u -d '-60 days' +%Y)"
      - name: Commit if changed
        run: |
          git config user.name  "vault-bot"
          git config user.email "vault-bot@users.noreply.github.com"
          git add data/cfbd/lines_*.json data/cfbd/espn_opens_*.json
          git diff --cached --quiet && { echo "No changes."; exit 0; }
          git commit -m "cfbd: refresh betting lines [skip ci]"
          git pull --rebase -q origin main
          git push
