# Pulls free PrizePicks pick'em lines into data/lineup-feed.json (vegas_player_props).
# Keyless — no secrets needed. Commits the updated feed so GitHub Pages serves it.
name: Update player props (PrizePicks)

on:
  workflow_dispatch: {}          # run manually any time from the Actions tab
  # No schedule: here on purpose. GitHub's scheduler fired this every 4-7 hours, so the sharp-refresh Cloudflare Worker
  # (workers/sharp-refresh/src/price-jobs.js) starts it with workflow_dispatch on the same UTC schedule: 17 * * * *
  # Hourly, every day, year-round, the practical max for a free cron that
  # also rebuilds Pages on each change. Runs at :17 (top-of-hour is GitHub's
  # most congested/most-skipped slot, so off-the-hour is more reliable).
  # It only commits when the feed actually changed, so quiet hours are free.

# Let a run cancel an older queued one; allow it to push to the repo.
concurrency:
  group: props-feed
  cancel-in-progress: false
permissions:
  contents: write

jobs:
  props:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: Fetch PrizePicks props → merge feed
        run: |
          node scripts/fetch-pickem-props.mjs --feed=data/lineup-feed.json

      # Sharp anchor: real-money Kalshi prop fairs the Best Bets grade is checked
      # against. continue-on-error so a Kalshi outage never blocks the props
      # refresh — build_best_bets is null-safe and falls back to the last
      # committed anchor (or no anchor, gate off) if the file is stale/missing.
      - name: Fetch Kalshi sharp anchor
        continue-on-error: true
        run: |
          node scripts/fetch-kalshi-props.mjs --out=data/kalshi_props.json

      # Kickoff wind forecast + the measured pass-yds wind multiplier. Before Best
      # Bets so it scores on the same adjustment the board shows. continue-on-error:
      # an Open-Meteo outage keeps the last committed file (readers fall back to ×1).
      - name: Fetch kickoff weather
        continue-on-error: true
        run: |
          node scripts/fetch-weather.mjs --feed=data/lineup-feed.json

      - name: Score Best Bets → merge feed
        run: |
          node scripts/build_best_bets.mjs --feed=data/lineup-feed.json

      - name: Commit if changed
        run: |
          if git diff --quiet -- data/lineup-feed.json data/kalshi_props.json data/weather.json data/best_bets_card.json data/best_bets_shadow.json data/best_bets_strict.json data/pickem_pairs_log.json data/qb_status.json; then
            echo "No prop changes."
          else
            git config user.name  "vault-bot"
            git config user.email "vault-bot@users.noreply.github.com"
            git add data/lineup-feed.json data/kalshi_props.json data/weather.json data/best_bets_card.json data/best_bets_shadow.json data/best_bets_strict.json data/pickem_pairs_log.json data/qb_status.json data/qb_news_log.json data/best_bets_held.json data/signal_log.json
            git commit -m "props: refresh PrizePicks lines + Kalshi sharp anchor [skip ci]"
            # Game days run the settle loop every 15 min; rebase + retry so a
            # push race doesn't drop the hour's lines (same as check-prop-feed).
            pushed=0
            for i in 1 2 3; do
              if git pull --rebase --autostash origin main && git push; then pushed=1; break; fi
              # A conflicting rebase stops half-way: abort it so the next try (and the runner) starts clean.
              if [ -d "$(git rev-parse --git-path rebase-merge)" ] || [ -d "$(git rev-parse --git-path rebase-apply)" ]; then
                git rebase --abort || true
              fi
              echo "push race, retrying ($i)..."; sleep 3
            done
            if [ "$pushed" != 1 ]; then
              echo "::error::git push failed after 3 tries; this run's data was NOT published."
              exit 1
            fi
          fi
