# Banks player-prop lines + Vault projections from data/lineup-feed.json into
# data/prop_line_history.json so we can later backtest the Betting page:
# closing-line value (CLV) for the de-vig engine, and the Model Lean projection
# vs. actual results. Reads the already-built feed — no API calls, no credits.
name: Update prop history

on:
  workflow_dispatch: {}
  # No schedule: here on purpose. GitHub's scheduler fired this every 4-7 hours, so the sharp-refresh Cloudflare Worker
  # (workers/sharp-refresh/src/price-jobs.js) starts it with workflow_dispatch on the same UTC schedule: 27 * * * *
  # Hourly, year-round. Runs at :27, after update-props commits the fresh
  # feed at :17, so it banks the latest lines. Freezes each prop's first-seen
  # snapshot as "open", rolls "cur" forward, and only commits when something
  # actually moved, so quiet hours are free. Finished weeks are retained.

concurrency:
  group: prop-history
  cancel-in-progress: false
permissions:
  contents: write

jobs:
  prop-history:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: Snapshot prop lines + projections
        run: node scripts/snapshot-prop-history.mjs --feed=data/lineup-feed.json --out=data/prop_line_history.json

      - name: Commit if changed
        run: |
          # status, not diff: anytime_td_history.json is untracked until its first commit
          if [ -z "$(git status --porcelain -- data/prop_line_history.json data/anytime_td_history.json)" ]; then
            echo "No prop-history changes."
          else
            git config user.name  "vault-bot"
            git config user.email "vault-bot@users.noreply.github.com"
            git add data/prop_line_history.json data/anytime_td_history.json
            git commit -m "props: snapshot prop line history [skip ci]"
            # Rebase on the latest main before pushing so overlapping jobs
            # never fail with "fetch first" (remote moved ahead). Retry a few times.
            for i in 1 2 3; do
              git pull --rebase --autostash origin main && git push && break
              echo "push race, retrying ($i)..."; sleep 3
            done
          fi
