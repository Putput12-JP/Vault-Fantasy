# Vault's NFL model page on Sharp Money (an experiment, same view as the CFB model): projects the NFL games the Sharp Money feed lists with the
# Vault line from data/game_model.json, logs any pick 3+ points from the market once (before kickoff), locks it an hour out, and grades finished
# picks against real scores and the closing spread. Writes data/nfl_model.json for the NFL Model page. Stdlib only, free and keyless.
# The yearly walk-forward summary lives in data/nfl_model_backtest.json (rebuild: python3 scripts/nfl_model.py backtest).
name: Update NFL model

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - 'scripts/nfl_model.py'
      - 'scripts/sharp_model_common.py'
      - 'data/nfl_model_backtest.json'
  schedule:
    - cron: '23 */3 * 9,10,11,12,1,2 *'
    - cron: '12,42 17-23 * 9,10,11,12,1 0'     # Sundays: every 30 minutes through game time so results post soon after the final
    - cron: '12,42 0-4 * 9,10,11,12,1 1,2,5,6' # ...and the Sunday, Monday and Thursday night games that finish after midnight UTC

concurrency:
  group: nfl-model
  cancel-in-progress: false
permissions:
  contents: write

jobs:
  model:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Load the Sharp Money feed
        run: |
          git fetch --depth=1 origin sharp-data
          git show FETCH_HEAD:data.json > /tmp/sharp.json
      - name: Update the model
        run: python3 scripts/nfl_model.py update --sharp /tmp/sharp.json
      - name: Commit if changed
        run: |
          git fetch -q origin main
          if git show origin/main:data/nfl_model.json > /tmp/prev.json 2>/dev/null && python3 - <<'PY'
          import json,sys
          a=json.load(open('/tmp/prev.json')); b=json.load(open('data/nfl_model.json'))
          for k in ('generated','backtest'): a.pop(k,None); b.pop(k,None)
          sys.exit(0 if a==b else 1)
          PY
          then
            echo "No model changes."
          else
            git config user.name  "vault-bot"
            git config user.email "vault-bot@users.noreply.github.com"
            git add data/nfl_model.json
            git commit -m "nfl model: refresh ratings, slate and pick log [skip ci]"
            git pull --rebase -q origin main
            git push
          fi
