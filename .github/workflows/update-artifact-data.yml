# Data for the standalone pages (vaultfantasy.com/track-record/ and /game-breakdowns/).
# Rebuilds each page's data.json from the pushed data/ files and force-pushes ONE
# commit to the `artifact-data` branch, which the pages read. No republishing and
# no Claude usage: the page files only change when someone edits the UI.
name: Update artifact data

on:
  workflow_dispatch: {}
  schedule:
    - cron: '*/15 * * * *'

concurrency:
  group: artifact-data
  cancel-in-progress: false
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Game windows (Central) every 15 min: Sun 8am-11pm, Mon/Thu 6-11pm, Tue/Fri
      # midnight-1am. Everything else once an hour.
      - name: Gate
        id: gate
        run: |
          export TZ=America/Chicago
          d=$(date +%u); h=$(date +%-H); m=$(date +%-M); go=0
          case "$d" in
            7)   [ "$h" -ge 8 ]  && [ "$h" -le 23 ] && go=1 ;;
            1|4) [ "$h" -ge 18 ] && [ "$h" -le 23 ] && go=1 ;;
            2|5) [ "$h" -le 1 ] && go=1 ;;
          esac
          [ "$m" -lt 15 ] && go=1
          [ "${{ github.event_name }}" = "workflow_dispatch" ] && go=1
          echo "go=$go" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v5
        if: steps.gate.outputs.go == '1'
      - uses: actions/setup-node@v5
        if: steps.gate.outputs.go == '1'
        with:
          node-version: 20
      - name: Build data
        if: steps.gate.outputs.go == '1'
        run: |
          python3 artifacts/track-record/build_data.py --local --out=artifact-out/track-record
          python3 artifacts/game-breakdowns/build_data.py --local --data-only --out=artifact-out/game-breakdowns
          rm -f artifact-out/*/data.sig
      - name: Publish to artifact-data
        if: steps.gate.outputs.go == '1'
        run: |
          cd artifact-out
          git init -q -b artifact-data
          git config user.name  "vault-bot"
          git config user.email "vault-bot@users.noreply.github.com"
          git add .
          git commit -q -m "artifact data: $(date -u +%FT%TZ) [skip ci]"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" artifact-data
