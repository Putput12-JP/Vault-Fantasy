# Proven-sharps side card record (docs/side-card-record.md). Every 2 hours:
#   1. scripts/grade_side_cards.py grades every frozen card's lock and shown size by Polymarket resolution, with CLV from
#      data/pm_closes.json, and rebuilds pm_record/cards_record.json (the pre-registered read, report-only until the final date)
#   1b. scripts/sharps_v2/pinclose.py appends a `pinclose` row per graded shown play (Pinnacle's closing no-vig price, from data/book_tape) and writes
#      pm_record/pinclose_record.json; it never blocks step 1 or 2
#   2. scripts/benchmark_h2h.py archives what the benchmark showed at each of our cuts (from its public repo's commit history, since
#      it rewrites its files every 10 minutes), grades the benchmark's real plays the same way, and rebuilds pm_record/h2h_record.json
# GitHub skips many scheduled runs, so the card build (pm-cards.yml, every 10 minutes) also starts this workflow when grading is stale
# (scripts/grading_stale.py). Runs queue behind each other in the `pm-record` concurrency group and are never cancelled.
# Rows are append-only on `pm-holders-data` (never force-pushed). Sharp money is context only: nothing here is a pick feed.
name: Proven-sharps record

on:
  workflow_dispatch:
  schedule:
    - cron: '50 */2 * * *'
    # every 30 min from 5 pm to midnight Central (UTC-6 until March 14, 2027; then 5 pm CDT is 22:00 UTC, so shift this window one hour earlier)
    - cron: '0,30 23,0-5 * * *'
    - cron: '0 6 * * *'

concurrency:
  group: pm-record
  cancel-in-progress: false
permissions:
  contents: write

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Unit tests
        run: python3 -m unittest tests.test_side_card_record
      - name: Check out pm-holders-data
        run: |
          if ! git ls-remote --exit-code --heads origin pm-holders-data >/dev/null 2>&1; then
            echo "No holders data yet; nothing to grade."; echo "SKIP=1" >> "$GITHUB_ENV"; exit 0
          fi
          git fetch -q --depth=1 origin +pm-holders-data:refs/remotes/origin/pm-holders-data
          git worktree add -q --detach pmdata origin/pm-holders-data   # not `data`: the repo has a data/ folder
          git -C pmdata config user.name  "vault-bot"
          git -C pmdata config user.email "vault-bot@users.noreply.github.com"
      - name: Grade the frozen cards
        if: env.SKIP != '1'
        run: |
          python3 scripts/grade_side_cards.py --cards pmdata/pm_cards --holders pmdata/pm_holders --closes data/pm_closes.json \
            --out pmdata/pm_record
      - name: Pinnacle close rows (context only, never blocks the grade)
        if: env.SKIP != '1'
        # `pinclose` rows: Pinnacle's closing no-vig price for each graded shown play, from the book tape in this checkout (scripts/sharps_v2/pinclose.py,
        # docs/sharps-v2-grader-note.md). Append-only, written once per play, after the result row. Any failure is a warning: the rows written by the
        # grade step above and every other file are untouched, and the next run tries again.
        run: |
          python3 -m unittest tests.test_pinclose || { echo "::warning::pinclose tests failed; no pinclose rows written this run"; exit 0; }
          python3 -I scripts/sharps_v2/pinclose.py --cards pmdata/pm_cards --out pmdata/pm_record --book-tape data/book_tape \
            || echo "::warning::pinclose rows not written this run"
      - name: Benchmark head-to-head
        if: env.SKIP != '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/benchmark_h2h.py --holders pmdata/pm_holders --out pmdata/pm_record
      - name: Commit (append-only)
        if: env.SKIP != '1'
        run: |
          python3 - <<'PY'
          import sys; sys.path.insert(0, "scripts")
          import os, scan_pm_holders as H, datetime as dt
          if not os.path.isdir(os.path.join("pmdata", "pm_record")):
              sys.exit(0)
          ok = H.commit_push("pmdata", "pm_record", ["."], "pm record: " + dt.datetime.utcnow().strftime("%Y-%m-%d %H:%M UTC") + " [skip ci]")
          sys.exit(0 if ok and H.remote_has_head("pmdata") else 1)
          PY
