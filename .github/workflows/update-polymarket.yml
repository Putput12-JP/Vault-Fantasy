# Pulls NFL game money flow from Polymarket (real-money prediction exchange) into
# data/polymarket.json — a second, independent real-dollar read the Betting Game
# Markets board shows next to Kalshi. Keyless and free — no secrets, no credits.
name: Update Polymarket markets

on:
  workflow_dispatch: {}          # run manually any time from the Actions tab
  # No schedule: here on purpose. GitHub's scheduler fired this every 4-7 hours, so the sharp-refresh Cloudflare Worker
  # (workers/sharp-refresh/src/price-jobs.js) starts it with workflow_dispatch on the same UTC schedule: 47 * * * *
  # Hourly, year-round. Polymarket prices/volume move through the day; the job
  # only commits when the file actually changed, so quiet hours are free. At
  # :47 to stay off the congested top-of-hour and away from the other feeds.

concurrency:
  group: polymarket-feed
  cancel-in-progress: false
permissions:
  contents: write

jobs:
  polymarket:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: Fetch Polymarket NFL game markets
        run: node scripts/fetch-polymarket.mjs --out=data/polymarket.json

      - name: Commit if changed
        run: |
          if git diff --quiet -- data/polymarket.json; then
            echo "No Polymarket changes."
          else
            git config user.name  "vault-bot"
            git config user.email "vault-bot@users.noreply.github.com"
            git add data/polymarket.json data/pm_signal_log.json
            git commit -m "polymarket: refresh NFL game markets [skip ci]"
            pushed=0
            for i in 1 2 3; do
              if git pull --rebase --autostash origin main && git push; then pushed=1; break; fi
              # A conflicting rebase stops half-way: abort it so the next try (and the runner) starts clean.
              if [ -d "$(git rev-parse --git-path rebase-merge)" ] || [ -d "$(git rev-parse --git-path rebase-apply)" ]; then
                git rebase --abort || true
              fi
              echo "push race, retrying ($i)..."; sleep 3
            done
            if [ "$pushed" != 1 ]; then
              echo "::error::git push failed after 3 tries; this run's data was NOT published."
              exit 1
            fi
          fi

      # The collector never fails the fetch step (prices still have to land), but if every Data API
      # call failed it leaves .pm-dead. Fail AFTER the commit so a retired or moved API is a red run,
      # not a silent week of empty money flow (Data API v1 retired 2026-11-02 that way).
      - name: Fail the run if the Polymarket Data API was dead
        if: always()
        run: |
          if [ -f .pm-dead ]; then cat .pm-dead; exit 1; fi
