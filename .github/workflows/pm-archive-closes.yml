# Polymarket's price at kickoff for every NFL and NBA game (moneyline, every spread and total line), from the
# Pendulum Flow orderbook archive (archive.pendulumflow.com; v3 hours CC BY 4.0, v3.1 hours from 2026-10-30T19 UTC
# CC BY-NC 4.0), into data/pm_closes.json.
# settle_bets.py grades NFL game calls against it; the NBA recorder grades Sharp Price signals against it.
# The archive publishes about 5 hours behind, so twice a day covers every game by the next morning. The 10-day
# lookback lets a multi-day archive stall heal on its own: games already stored are skipped, so it costs only the gaps.
name: Polymarket closes

on:
  workflow_dispatch: {}
  schedule:
    - cron: '41 0,3,9,13,16,20 * * *'   # CBB plays all evening, so it needs more than two runs (NFL and NBA add nothing on the extra ones)

concurrency:
  group: pm-closes
  cancel-in-progress: false
permissions:
  contents: write

jobs:
  closes:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          # The closes step only reads this script and data/pm_closes.json, then commits that file.
          # A full tip checkout was downloading every blob and using ~28 of the 30 minute limit.
          sparse-checkout: |
            /scripts/pm_archive.py
            /data/pm_closes.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install DuckDB
        run: pip install --quiet duckdb pytz
      - name: Pull closes from the archive
        run: python scripts/pm_archive.py closes --sports nfl,nba --days 10
      - name: Pull CBB closes (forward only, own time cap)
        # CBB has about 130 games a day, so it gets a short lookback and a cap: NFL and NBA never wait on it. The prereg for the CBB
        # card test stays ROI-only (grade_side_cards NO_CLOSES); these closes feed the wallets' beat-the-close read on the Following page.
        continue-on-error: true
        run: python scripts/pm_archive.py closes --sports cbb --days 2 --max-secs 1500
      - name: Commit if changed
        run: |
          git config user.name  "vault-bot"
          git config user.email "vault-bot@users.noreply.github.com"
          git pull --rebase --autostash origin ${GITHUB_REF_NAME} || true
          git add data/pm_closes.json
          if git diff --staged --quiet; then
            echo "No new closes."
          else
            git commit -m "data: Polymarket closes from the orderbook archive [skip ci]"
            git push
          fi
