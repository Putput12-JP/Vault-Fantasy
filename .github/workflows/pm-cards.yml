# Proven-sharps side cards (scripts/build_side_cards.py, docs/side-cards.md). Started by the holders scan (pm-holders.yml) right
# after it pushes new T-15 keyframes, and every 10 minutes as a backstop:
#   - frozen cards: one per new T-15 keyframe, committed once to pm_cards/ on `pm-holders-data` (never force-pushed)
#   - live cards: every upcoming game, published as ONE parentless commit holding live.json on `pm-cards-live` (force-pushed,
#     like nba-live), so a file rewritten every 10 minutes never grows any history
# Sharp money is context only: the cards never feed Top Reads, SM_GATE or an agree total. lock_shadow is the pre-registered
# forward test of docs/sharp-card-prereg.md.
name: Proven-sharps side cards

on:
  workflow_dispatch:
  schedule:
    - cron: '*/10 * * * *'

concurrency:
  group: pm-cards
  cancel-in-progress: false
permissions:
  contents: write

jobs:
  cards:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Unit tests
        run: python3 -m unittest tests.test_side_cards tests.test_sf_rungs
      - name: Inputs (holders, ledger, Vault games)
        run: |
          if ! git ls-remote --exit-code --heads origin pm-holders-data >/dev/null 2>&1; then
            echo "No holders data yet; nothing to build."; echo "SKIP=1" >> "$GITHUB_ENV"; exit 0
          fi
          git fetch -q --depth=1 origin \
            +pm-holders-data:refs/remotes/origin/pm-holders-data \
            +sharp-history:refs/remotes/origin/sharp-history \
            +sharp-data:refs/remotes/origin/sharp-data
          git worktree add -q --detach pmdata origin/pm-holders-data   # not `data`: the repo has a data/ folder
          git worktree add -q --detach hist origin/sharp-history
          git show origin/sharp-data:data.json > sharp_data.json || echo '{"games":[]}' > sharp_data.json
          # the last published live cards: each shown size keeps the price it was first flagged at while the side stays the same
          git fetch -q --depth=1 origin +pm-cards-live:refs/remotes/origin/pm-cards-live 2>/dev/null \
            && git show origin/pm-cards-live:live.json > prev_live.json || echo '{"games":[]}' > prev_live.json
          # The benchmark's published exclusion list (market makers and traders), for the `sfx` shadow variant; on a failed fetch the
          # variant is simply left out of this run, never built on an empty list
          curl -sf --max-time 30 https://raw.githubusercontent.com/dpk1212/nhl-savant/main/public/sharp_intel_excluded_wallets.json \
            -o sf_excluded.json || rm -f sf_excluded.json
          git -C pmdata config user.name  "vault-bot"
          git -C pmdata config user.email "vault-bot@users.noreply.github.com"
      - name: Build
        if: env.SKIP != '1'
        run: |
          python3 scripts/build_side_cards.py --holders pmdata/pm_holders --ledger hist/pm_ledger --sharp-data sharp_data.json \
            --frozen-out pmdata/pm_cards --live-out live/live.json --closes data/pm_closes.json --prev-live prev_live.json \
            --sf-excluded sf_excluded.json
      - name: Commit frozen cards (append-only)
        if: env.SKIP != '1'
        run: |
          python3 - <<'PY'
          import sys; sys.path.insert(0, "scripts")
          import os, scan_pm_holders as H, datetime as dt
          sports = [s for s in ("nba", "nfl", "cfb") if os.path.isdir(os.path.join("pmdata", "pm_cards", s))]   # git add fails on a missing path
          if not sports:
              sys.exit(0)
          ok = H.commit_push("pmdata", "pm_cards", sports, "pm cards: " + dt.datetime.utcnow().strftime("%Y-%m-%d %H:%M UTC") + " [skip ci]")
          sys.exit(0 if ok and H.remote_has_head("pmdata") else 1)
          PY
      - name: Publish live cards (single commit, force-pushed)
        if: env.SKIP != '1'
        run: |
          git config user.name  "vault-bot"
          git config user.email "vault-bot@users.noreply.github.com"
          blob=$(git hash-object -w live/live.json)
          tree=$(printf '100644 blob %s\tlive.json\n' "$blob" | git mktree)
          c=$(git commit-tree "$tree" -m "pm cards live $(date -u +%FT%TZ)")
          git push -q --force origin "$c:refs/heads/pm-cards-live"
