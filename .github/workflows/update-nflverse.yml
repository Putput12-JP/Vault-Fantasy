name: Update nflverse data

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install requests

      - name: Run data processor
        run: |
          python scripts/process_nflverse.py

      - name: Rebuild usage cascade
        # Measures the injury teammate-cascade (WR1 out → more targets for WR2/3;
        # RB2 handcuff) from the freshly-written nflverse_stats_* seasons. Pure
        # stdlib; writes data/usage_cascade.json (buckets only publish past
        # MIN_EVENTS, so a thin run simply ships fewer and serving no-ops).
        run: |
          python scripts/build_usage_cascade.py --since 2014

      - name: Rebuild QB-out impact
        # Measures how a team's skill players re-rate when the primary QB is out
        # (passing game down, backup QB below the starter) from the same seasons.
        # Pure stdlib; writes data/qb_out_impact.json. Buckets publish only past
        # MIN_EVENTS and a sign + even/odd stability gate, so a thin/degraded run
        # simply ships fewer and the frontend falls back to withholding.
        run: |
          python scripts/build_qb_out_impact.py --since 2007

      - name: Rebuild vacated share
        # Measures the ROSTER-DEPARTURE analogue of the cascade: how a returning
        # player's own volume shifts season-over-season when a same-position
        # starter LEAVES the team (traded/signed elsewhere/retired), net of normal
        # year-to-year drift, split by whether the departure was ranked above or
        # below him. Pure stdlib; writes data/vacated_share.json. Buckets publish
        # only past MIN_EVENTS and a sign + even/odd stability gate, so a thin run
        # simply ships fewer and the frontend falls back to pure history. Also
        # emits last season's ranked rooms for the live roster diff.
        run: |
          python scripts/build_vacated_share.py --since 2014

      - name: Rebuild grade calibration
        # Fits Grade Keys factor weights from the freshly-written nflverse_stats_*
        # seasons (pure stdlib, no deps). Writes data/grade_calibration.json; a
        # factor/pos cell only publishes when it beats carry walk-forward, so a
        # thin/degraded run simply publishes less and the frontend keeps its
        # hand-authored constants (null-fallback).
        run: |
          python scripts/build_grade_calibration.py

      - name: Commit and push updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --staged --quiet || git commit -m "chore: update nflverse data $(date -u +%Y-%m-%d)"
          git push
