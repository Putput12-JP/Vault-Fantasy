<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Proven sharps side card · Vault NBA</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@500;600&display=swap">
<style>
/* Vault NBA skin: "Graphite" (nba/ui/projections.template.html). Geist with Geist Mono numbers on cool off-black,
   16px cards with a hairline border, mono uppercase section labels like the Follow Board header row. */
:root{
  --c-bg:#0b0c0e;--c-card:#131418;--c-line:#22252b;--c-line2:#343841;--c-ink:#f3f4f6;--c-mut:#a2a7b1;--c-dim:#6e7380;
  --c-good:#5fcf8c;--c-on-good:#0b0c0e;--c-bad:#ec7f7f;--c-warn:#e5b955;--c-gold:#e5c877;
  --c-good-bg:rgba(95,207,140,.10);--c-good-line:rgba(95,207,140,.5);--c-good-box:rgba(95,207,140,.05);
  --c-bad-line:rgba(236,127,127,.45);--c-bad-box:rgba(236,127,127,.05);--c-box:#191b20;--c-sel:rgba(243,244,246,.09);
  --c-rb-unp:#7b818d;--c-tile:#f3f4f6;--c-tile-ink:#0b0c0e;
  --c-shadow:0 1px 0 rgba(255,255,255,.03) inset,0 12px 32px -14px rgba(0,0,0,.6);
  --c-r:16px;--c-pad:24px;--c-sans:'Geist',system-ui,-apple-system,'Segoe UI',sans-serif;--c-num:'Geist Mono','SFMono-Regular',Menlo,monospace;--c-num-ls:-.02em;
  --vseg-bg:#191b20;--vseg-border:#22252b;--vseg-ink:#a2a7b1;--vseg-on-ink:#0b0c0e;--vseg-pill:#f3f4f6;
  color-scheme:dark;
}
:root[data-theme=light]{
  --c-bg:#f5f5f7;--c-card:#ffffff;--c-line:#e6e6e9;--c-line2:#cfd1d6;--c-ink:#1d1e22;--c-mut:#5a5d66;--c-dim:#767983;
  --c-good:#15803d;--c-on-good:#ffffff;--c-bad:#c62828;--c-warn:#a05a00;--c-gold:#8a6400;
  --c-good-bg:rgba(21,128,61,.08);--c-good-line:rgba(21,128,61,.45);--c-good-box:rgba(21,128,61,.04);
  --c-bad-line:rgba(198,40,40,.4);--c-bad-box:rgba(198,40,40,.04);--c-box:#fafafb;--c-sel:rgba(29,30,34,.08);
  --c-rb-unp:#aeb2bb;--c-tile:#ebebee;--c-tile-ink:#1d1e22;--c-shadow:0 1px 2px rgba(0,0,0,.04);
  --vseg-bg:#ebebee;--vseg-border:#e6e6e9;--vseg-ink:#5a5d66;--vseg-on-ink:#ffffff;--vseg-pill:#1d1e22;
  color-scheme:light;
}
html,body{margin:0;background:var(--c-bg);color:var(--c-ink);font-family:var(--c-sans);-webkit-font-smoothing:antialiased}
.sc-lab,.sc-eyebrow,.sc-mk1 b,.sc-form span,.sc-clim,.sc-ctll,.sl-t span,.sc-sport{font-family:var(--c-num);letter-spacing:.08em}
.sc-pill{font-family:var(--c-num);letter-spacing:.06em;border-radius:9999px;height:24px;font-size:10.5px}
.sc-logo{border-radius:10px}.sc-mk{border-radius:10px}.sc-sig{border-radius:12px}
.sc-side{font-weight:600}
@media (max-width:767px){:root{--c-pad:16px;--c-gutter:12px}.sc-wr{letter-spacing:-.03em}}

/* Proven-sharps side card. Shared by both mocks; each page sets the --c-* skin tokens.
   Motion tokens and .vseg are inlined from vault-ds.css (sections 19 and 20) because standalone mocks cannot link it. */
:root{
  --ease-out:cubic-bezier(0.16,1,0.3,1);
  --ease-rail:cubic-bezier(0.65,0,0.35,1);
  --ease-spring:cubic-bezier(0.34,1.56,0.64,1);
  --dur-press:80ms; --dur-release:500ms; --dur-rail:400ms;
  --press-chip:.88; --press-btn:.94; --press-card:.975; --press-row:.99;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}

/* press primitive (vault-ds.css 19.1) */
.press{transition:transform var(--dur-release) var(--ease-spring)}
.press:active{transform:scale(var(--press-scale,.94));transition:transform var(--dur-press) ease-out}
.press-chip{--press-scale:var(--press-chip)}.press-card{--press-scale:var(--press-card)}

/* .vseg (vault-ds.css 20), retinted through the vars only */
.vseg{position:relative;display:inline-flex;align-items:center;flex-shrink:0;gap:2px;padding:3px;max-width:100%;
  background:var(--vseg-bg);border:1px solid var(--vseg-border);border-radius:9px}
.vseg>button{position:relative;z-index:1;display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:32px;padding:0 14px;
  border:0;background:transparent;border-radius:6px;color:var(--vseg-ink);font-family:var(--c-sans);font-size:12.5px;font-weight:600;
  letter-spacing:-.01em;white-space:nowrap;cursor:pointer;transition:color .12s ease}
.vseg>button.on{color:var(--vseg-on-ink)}
.vseg>button:disabled{opacity:.38;cursor:default}
.vseg.sm>button{min-height:26px;padding:0 10px;font-size:11.5px}
.vseg .v-pill{position:absolute;z-index:0;top:3px;bottom:3px;left:0;width:0;border-radius:6px;background:var(--vseg-pill);opacity:0;
  transition:left var(--dur-rail) var(--ease-rail),width var(--dur-rail) var(--ease-rail)}
.vseg.rail-noanim .v-pill{transition:none}
@media (max-width:767px){
  .vseg>button{min-height:36px}.vseg.sm>button{min-height:30px}
  .vseg>button::after{content:"";position:absolute;inset:-4px 0}
}

/* ── the card ── */
.sc{background:var(--c-card);border:var(--c-bw,1px) solid var(--c-line);border-radius:var(--c-r);padding:var(--c-pad);color:var(--c-ink);
  font-family:var(--c-sans);font-size:14px;line-height:1.35;min-width:0;box-shadow:var(--c-shadow,none)}
.sc .num{font-family:var(--c-num);font-variant-numeric:tabular-nums;letter-spacing:var(--c-num-ls,0)}
.sc-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.sc-sport{color:var(--c-gold);font-weight:700;letter-spacing:.14em;font-size:11.5px;margin-right:8px}
.sc-match{color:var(--c-mut);font-size:15px;font-weight:500}
.sc-time{color:var(--c-dim);font-size:13.5px;margin-top:4px;letter-spacing:.02em}
.sc-pill{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 12px;border-radius:99px;font-size:11px;font-weight:700;
  letter-spacing:.1em;white-space:nowrap;flex:none}
.sc-pill.live{color:var(--c-mut);border:1px solid var(--c-line2)}
.sc-pill.live i{width:7px;height:7px;border-radius:50%;background:var(--c-warn);animation:sc-pulse 1.8s ease-in-out infinite}
.sc-pill.locked{background:var(--c-good);color:var(--c-on-good)}
.sc-pill svg{width:12px;height:12px}
.sc-pillsub{color:var(--c-dim);font-size:11.5px;text-align:right;margin-top:5px;white-space:nowrap}
@keyframes sc-pulse{50%{opacity:.25}}

.sc-ctl{display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;align-items:center;margin-top:14px}

.sc-head{display:flex;align-items:center;gap:14px;margin-top:18px}
.sc-logo{width:56px;height:56px;border-radius:14px;background:var(--c-tile);display:grid;place-items:center;flex:none;overflow:hidden;
  font-weight:700;font-size:15px;color:var(--c-tile-ink);letter-spacing:.02em}
.sc-logo img{width:78%;height:78%;object-fit:contain}
.sc-logo.none{background:transparent;border:1.5px dashed var(--c-line2);color:var(--c-dim)}
.sc-hl{flex:1;min-width:0}
.sc-eyebrow{font-size:10.5px;font-weight:600;letter-spacing:.14em;color:var(--c-dim);text-transform:uppercase}
.sc-side{font-size:30px;font-weight:700;letter-spacing:-.03em;line-height:1.08;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sc-side.quiet{font-size:22px;color:var(--c-mut);letter-spacing:-.02em}
.sc-price{color:var(--c-mut);font-size:14px;margin-top:3px}
.sc-price .na{color:var(--c-dim)}
.sc-amt{text-align:right;flex:none}
.sc-amt b{display:block;font-size:30px;font-weight:700;letter-spacing:-.03em;line-height:1.08;color:var(--c-gold)}
.sc-amt b.zero{color:var(--c-dim)}
.sc-amt span{display:block;font-size:12.5px;color:var(--c-good);margin-top:3px;font-weight:500}
.sc-amt b.zero+span{color:var(--c-dim)}

.sc-lab{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:10.5px;font-weight:600;letter-spacing:.16em;
  color:var(--c-dim);text-transform:uppercase;margin:20px 0 9px}
.sc-lab em{font-style:normal;letter-spacing:.02em;text-transform:none;font-weight:500;font-size:12px;color:var(--c-mut)}

.sc-stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr))}
.sc-stat{padding:10px 12px;border-left:1px solid var(--c-line)}
.sc-stat:first-child{border-left:0;background:var(--c-good-bg);border-radius:10px}
.sc-stat:nth-child(2){border-left:0}
.sc-stat b{display:block;font-size:22px;font-weight:600;letter-spacing:-.02em;white-space:nowrap}
.sc-stat b small{font-size:.55em;font-weight:600;margin-left:1px}
.sc-stat b.na{color:var(--c-dim);font-weight:500}
.sc-stat span{display:block;font-size:10px;font-weight:600;letter-spacing:.14em;color:var(--c-dim);margin-top:3px}
.sc-dots{display:flex;align-items:center;gap:5px;margin-top:11px}
.sc-dots i{width:7px;height:7px;border-radius:50%;background:var(--c-dim);flex:none}
.sc-dots i.W{background:var(--c-good)}.sc-dots i.L{background:var(--c-bad)}
.sc-dots span{font-size:10px;font-weight:600;letter-spacing:.14em;color:var(--c-dim);margin-left:8px;white-space:nowrap}

.sc-none{border:1px dashed var(--c-line2);border-radius:12px;padding:13px 14px;display:flex;gap:12px;align-items:flex-start}
.sc-none svg{width:18px;height:18px;flex:none;color:var(--c-dim);margin-top:1px}
.sc-none b{display:block;font-size:14px;font-weight:600}
.sc-none p{margin:3px 0 0;font-size:12.5px;color:var(--c-mut);line-height:1.45}

/* wallets → where it went */
.sc-flow{display:flex;flex-direction:column;gap:14px}
.sc-blk{display:grid;grid-template-columns:minmax(0,1fr) var(--sk-w) minmax(0,var(--box-w));align-items:center}
.sc-rows{display:flex;flex-direction:column;min-width:0}
.sc-row{height:var(--row-h);display:flex;flex-direction:column;justify-content:center;min-width:0}
.sc-row b{font-size:14.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:5px}
.sc-row b small{font-weight:500;font-size:11.5px;color:var(--c-mut)}
.sc-row b svg{width:13px;height:13px;flex:none;color:var(--c-gold)}
.sc-row.hc b{color:var(--c-gold)}
.sc-row.agg b{font-weight:600}
.sc-row.exc b,.sc-row.unp b{color:var(--c-mut)}
.sc-row>span{font-size:12px;color:var(--c-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sc-sk{display:block;width:var(--sk-w);overflow:visible}
.sc-sk .rail{stroke:var(--c-line2);stroke-width:1}
.sc-sk .rb{opacity:.9}
.sc-sk .rb.hc{fill:var(--c-gold)}.sc-sk .rb.sharp{fill:var(--c-good)}.sc-sk .rb.unp{fill:var(--c-rb-unp)}
.sc-sk .rb.loser{fill:var(--c-bad)}.sc-sk .rb.exc{fill:none;stroke:var(--c-dim);stroke-width:1.2;stroke-dasharray:3 3}
.sc-sk circle{fill:var(--c-card);stroke-width:2}
.sc-sk circle.hc{stroke:var(--c-gold)}.sc-sk circle.sharp{stroke:var(--c-good);fill:var(--c-good)}
.sc-sk circle.unp{stroke:var(--c-rb-unp)}.sc-sk circle.loser{stroke:var(--c-bad)}.sc-sk circle.exc{stroke:var(--c-dim);stroke-dasharray:2 2}

.sc-box{all:unset;box-sizing:border-box;cursor:pointer;display:flex;flex-direction:column;justify-content:center;min-height:var(--box-h);
  align-self:stretch;border:1.5px solid var(--c-line2);border-radius:18px;padding:12px 14px;background:var(--c-box);min-width:0}
.sc-box:focus-visible{outline:2px solid var(--c-ink);outline-offset:2px}
.sc-box.good{border-color:var(--c-good-line);background:var(--c-good-box)}
.sc-box.bad{border-color:var(--c-bad-line);background:var(--c-bad-box)}
.sc-box.sel{box-shadow:0 0 0 3px var(--c-sel)}
.sc-box u{text-decoration:none;font-size:10.5px;font-weight:600;letter-spacing:.16em;color:var(--c-dim);text-transform:uppercase;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sc-box .big{font-size:22px;font-weight:700;letter-spacing:-.02em;line-height:1.15;margin-top:2px}
.sc-box .big small,.sc-box .ln small{font-family:var(--c-sans);font-size:12.5px;font-weight:500;letter-spacing:.01em;color:var(--c-mut);margin-left:4px}
.sc-box .big.zero{color:var(--c-dim)}
.sc-box .big.red{color:var(--c-bad)}
.sc-box .pc{font-size:14px;font-weight:600;line-height:1.2}
.sc-box .pc small{display:block;font-family:var(--c-sans);font-weight:500;font-size:12px;color:var(--c-mut)}
.sc-box .ln{font-size:16px;font-weight:700;letter-spacing:-.01em;line-height:1.3}
.sc-box .ln.red,.sc-box .ln.red small{color:var(--c-bad)}
.sc-box .ln.dim,.sc-box .ln.dim small{color:var(--c-dim);font-weight:600}
.sc-mix{display:flex;height:4px;border-radius:2px;overflow:hidden;margin-top:9px;background:var(--c-line)}
.sc-mix i{display:block;height:100%}
.sc-mix .sharp{background:var(--c-good)}.sc-mix .hc{background:var(--c-gold)}.sc-mix .unp{background:var(--c-rb-unp)}.sc-mix .loser{background:var(--c-bad)}
.sc-mix .exc{background:repeating-linear-gradient(90deg,var(--c-dim) 0 2px,transparent 2px 4px)}

.sc-rule{margin-top:14px;border:1px dashed var(--c-line2);border-radius:12px;font-size:12.5px;color:var(--c-mut)}
.sc-rule summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:8px;padding:9px 12px;font-weight:600;color:var(--c-mut)}
.sc-rule summary::-webkit-details-marker{display:none}
.sc-rule summary svg{width:13px;height:13px;flex:none}
.sc-rule summary span{margin-left:auto;font-weight:500;color:var(--c-dim);font-size:11.5px}
.sc-rule p{margin:0;padding:0 12px 11px;line-height:1.5}

.sc-foot{margin-top:16px;padding-top:12px;border-top:1px solid var(--c-line);font-size:11.5px;color:var(--c-dim);line-height:1.55}
.sc-foot b{color:var(--c-mut);font-weight:600}
.sc-empty{margin-top:18px;border:1px dashed var(--c-line2);border-radius:14px;padding:22px 16px;text-align:center}
.sc-empty b{display:block;font-size:15px;font-weight:600}
.sc-empty p{margin:5px auto 0;font-size:13px;color:var(--c-mut);max-width:34ch;line-height:1.45}

/* v2: header right, climate, market balance rows, suggested units, holders */
.sc-tr{display:flex;flex-direction:column;align-items:flex-end;gap:7px;flex:none}
.sc-clim{display:inline-flex;align-items:center;gap:3px;font-size:10.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--c-dim)}
.sc-clim i{width:5px;height:11px;border-radius:2px;background:var(--c-line2)}
.sc-clim i:last-of-type{margin-right:5px}
.sc-clim.building{color:var(--c-warn)}.sc-clim.building i:nth-child(-n+2){background:var(--c-warn)}
.sc-clim.signal{color:var(--c-good)}.sc-clim.signal i{background:var(--c-good)}
.sc-ctl{justify-content:flex-end}
.sc-ctll{font-size:10.5px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--c-dim);margin-right:2px}

.sc-mks{display:flex;flex-direction:column;gap:6px;margin-top:12px}
.sc-mk{all:unset;box-sizing:border-box;display:block;width:100%;cursor:pointer;padding:10px 12px 12px;border-radius:12px;border:1px solid var(--c-line);background:transparent;
  transition:transform var(--dur-release) var(--ease-spring),background-color .12s ease,border-color .12s ease}
.sc-mk:active{transform:scale(var(--press-row));transition:transform var(--dur-press) ease-out}
.sc-mk.on{background:var(--c-box);border-color:var(--c-line2);box-shadow:inset 3px 0 0 var(--c-ink)}
.sc-mk.off{cursor:default;opacity:.55;border-style:dashed}
.sc-mk:focus-visible{outline:2px solid var(--c-ink);outline-offset:2px}
.sc-mk1{display:flex;justify-content:space-between;align-items:center;gap:10px}
.sc-mk1 b{font-size:10.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--c-mut)}
.sc-u{font-size:11px;font-weight:600;letter-spacing:.04em;color:var(--c-dim);white-space:nowrap}
.sc-u.on{color:var(--c-on-good);background:var(--c-good);border-radius:99px;padding:2px 9px;font-size:12.5px;font-weight:700}
.sc-mk2{display:flex;justify-content:space-between;gap:10px;margin-top:5px;font-size:14px;font-weight:600}
.sc-mk2 span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.sc-mk2 em{font-style:normal;font-weight:500;color:var(--c-mut);font-size:13px}
.sc-mk2 .pk{color:var(--c-good)}
.sc-bar{display:flex;align-items:center;height:10px;margin-top:7px}
.sc-bar>u{width:2px;height:16px;background:var(--c-ink);border-radius:1px;flex:none;text-decoration:none}
.sc-half{flex:1;display:flex;height:100%;gap:1px;min-width:0}
.sc-half.l{flex-direction:row-reverse}
.sc-half i{display:block;height:100%;flex:none}
.sc-half.l i:last-child{border-radius:3px 0 0 3px}.sc-half.r i:last-child{border-radius:0 3px 3px 0}
.sc-half .hc,.sc-key .hc::before{background:var(--c-gold)}.sc-half .sharp,.sc-key .sharp::before{background:var(--c-good)}
.sc-half .unp,.sc-key .unp::before{background:var(--c-rb-unp)}.sc-half .loser,.sc-key .loser::before{background:var(--c-bad)}
.sc-half .exc,.sc-key .exc::before{background:repeating-linear-gradient(90deg,var(--c-dim) 0 2px,transparent 2px 4px)}
.sc-key{display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:9px;font-size:11px;color:var(--c-dim)}
.sc-key span{display:inline-flex;align-items:center;gap:5px}
.sc-key span::before{content:"";width:10px;height:6px;border-radius:2px}

.sc-sig{margin-top:16px;border-radius:14px;padding:14px;border:1px solid var(--c-line2);background:var(--c-box)}
.sc-sig.on{border-color:var(--c-good-line);background:var(--c-good-box)}
.sc-sig.off{border-style:dashed;background:transparent}
.sc-sig1{display:flex;align-items:center;gap:13px}
.sc-sig .sc-side{font-size:26px}.sc-sig .sc-side.quiet{font-size:20px}
.sc-sig.off .sc-price{font-size:12.5px;line-height:1.45}
.sc-units{text-align:right;flex:none}
.sc-units b{display:block;font-size:44px;font-weight:700;letter-spacing:-.04em;line-height:.95;color:var(--c-good)}
.sc-units b small{font-size:.5em;font-weight:600;margin-left:1px}
.sc-pips{display:flex;gap:3px;justify-content:flex-end;margin-top:7px}
.sc-pips i{width:11px;height:5px;border-radius:2px;background:var(--c-line2)}.sc-pips i.on{background:var(--c-good)}
.sc-gates{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px;align-items:center}
.sc-gl{font-size:12px;font-weight:600;color:var(--c-mut);margin-right:2px}
.sc-gate{display:inline-flex;align-items:center;gap:5px;min-height:24px;padding:2px 9px;border-radius:99px;font-size:11.5px;font-weight:500;border:1px solid var(--c-line2);color:var(--c-mut)}
.sc-gate svg{width:11px;height:11px;flex:none}
.sc-gate.ok{color:var(--c-ink)}.sc-gate.ok svg{color:var(--c-good)}
.sc-gate.no svg{color:var(--c-bad)}.sc-gate.na{border-style:dashed;color:var(--c-dim)}
.sc-fine{margin:11px 0 0;font-size:11.5px;line-height:1.5;color:var(--c-mut)}

.sc-sides{display:flex;flex-direction:column;gap:16px}
.sc-sdh{display:flex;align-items:center;gap:9px;padding-bottom:7px;border-bottom:1px solid var(--c-line)}
.sc-sdh b{font-size:15px;font-weight:600}.sc-sdh span{margin-left:auto;font-size:12.5px;color:var(--c-mut)}
.sc-logo.sm{width:26px;height:26px;border-radius:7px;font-size:10px}

  return d.toLocaleDateString('en-US', {timeZone:'America/Chicago', weekday:'short', month:'short', day:'numeric'}) + ' · ' + t;
}
function dur(s){ var h = Math.floor(s / 3600), m = Math.round((s % 3600) / 60); return h >= 48 ? Math.round(h / 24) + 'd' : h ? h + 'h ' + m + 'm' : m + 'm'; }
function phone(){ return matchMedia('(max-width:767px)').matches; }

function logo(name, g){
  if (name === 'Over' || name === 'Under') return '<div class="sc-logo">' + name[0] + '</div>';
  var ab = [g.vault.away, g.vault.home].filter(function(a){ return TEAMS[a] && TEAMS[a][0] === name; })[0];
  if (!ab) return '<div class="sc-logo">' + esc(name.slice(0, 3).toUpperCase()) + '</div>';
  return '<div class="sc-logo"><img alt="" src="https://a.espncdn.com/i/teamlogos/nba/500/' + TEAMS[ab][1] + '.png" onerror="this.replaceWith(document.createTextNode(\'' + ab + '\'))"></div>';
}
function sideOrder(g, m, key){
  var names = Object.keys(m.sides);
  if (key === 'total') return names.sort();                         /* Over, Under */
  var away = TEAMS[g.vault.away] && TEAMS[g.vault.away][0];
  return names.sort(function(a, b){ return (a === away ? 0 : 1) - (b === away ? 0 : 1); });
}
function sideLabel(name, key, ls){
  if (key === 'ml') return name + ' ML';
  if (key === 'total') return name;
  if (ls && ls.side === name && ls.line != null) return name + ' ' + (ls.line > 0 ? '+' : '') + ls.line;
  return name + ' spread';
}

var CHK = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 8.5l3 3 6-7"/></svg>';
var XX = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4.5 4.5l7 7M11.5 4.5l-7 7"/></svg>';
function counted(s){ return s.sharp_usd + s.unproven_usd + s.loser_usd; }
function nProven(s){ return s.counts.sharp + s.counts.hc; }
function shadow(m, v){ var ls = (m.lock_shadow || {})[v] || {}; return ls.side && ls.gates ? ls : null; }
/* climate, from stored fields only: signal = a side meets the tracked rule; building = proven money somewhere; quiet = none */
function climate(g, v){
  var c = 'quiet';
  Object.keys(g.markets).forEach(function(k){ var m = g.markets[k];
    if (shadow(m, v)) c = 'signal';
    else if (c === 'quiet' && Object.keys(m.sides).some(function(n){ return m.sides[n][v].sharp_usd > 0; })) c = 'building'; });
  return c;
}
var CLIM = {quiet:'Quiet', building:'Building', signal:'Signal'};

/* one side of the balance bar: classes stacked outward from the centre line */
function half(s, max, dir){
  var seg = function(k, v){ return v > 0 ? '<i class="' + k + '" style="width:' + Math.max(1.2, v / max * 100).toFixed(2) + '%"></i>' : ''; };
  return '<div class="sc-half ' + dir + '">' + seg('hc', s.hc_usd) + seg('sharp', s.sharp_usd - s.hc_usd) + seg('unp', s.unproven_usd) + seg('loser', s.loser_usd) + seg('exc', s.excluded_usd) + '</div>';
}
function unitChip(ls){
  if (!ls) return '<span class="sc-u off">no play</span>';
  return '<span class="sc-u on num">' + (ls.units_clean_ladder == null ? 'n/a' : ls.units_clean_ladder + 'u') + '</span>';
}
function marketRow(g, key, label, st){
  var m = g.markets[key];
  if (!m) return '<div class="sc-mk off"><div class="sc-mk1"><b>' + label + '</b><span class="sc-u off">not read yet</span></div></div>';
  var names = sideOrder(g, m, key), a = m.sides[names[0]][st.variant], b = m.sides[names[1]][st.variant], ls = shadow(m, st.variant);
  var max = Math.max(counted(a) + a.excluded_usd, counted(b) + b.excluded_usd) || 1;
  var nm = function(n, s){ return '<span' + (ls && ls.side === n ? ' class="pk"' : '') + '>' + esc(n) + ' <em class="num">' + usd(counted(s)) + '</em></span>'; };
  return '<button type="button" class="sc-mk press press-row' + (st.group === key ? ' on' : '') + '" data-g="' + key + '" aria-pressed="' + (st.group === key) + '">' +
    '<div class="sc-mk1"><b>' + label + '</b>' + unitChip(ls) + '</div>' +
    '<div class="sc-mk2">' + nm(names[0], a) + nm(names[1], b) + '</div>' +
    '<div class="sc-bar">' + half(a, max, 'l') + '<u></u>' + half(b, max, 'r') + '</div></button>';
}

/* the suggested-units block. Units are the stored units_clean_ladder of the pre-registered rule; nothing is computed here. */
function signal(g, m, key, names, v){
  var ls = shadow(m, v), S = {}; names.forEach(function(n){ S[n] = m.sides[n][v]; });
  var gate = function(ok, t){ return '<span class="sc-gate ' + (ok == null ? 'na' : ok ? 'ok' : 'no') + '">' + (ok == null ? '' : ok ? CHK : XX) + t + '</span>'; };
  if (ls){
    var q = ls.gates, u = ls.units_clean_ladder, pips = '';
    for (var i = 1; i <= 5; i++) pips += '<i' + (u != null && i <= u ? ' class="on"' : '') + '></i>';
    return '<div class="sc-sig on"><div class="sc-sig1">' + logo(ls.side, g) + '<div class="sc-hl"><div class="sc-eyebrow">Suggested units · ' + (g.frozen ? 'locked' : 'live, can change until ' + ct(g.cut) + ' CT') + '</div>' +
      '<div class="sc-side">' + esc(sideLabel(ls.side, key, ls)) + '</div><div class="sc-price">' +
      (ls.price != null ? '<span class="num">' + trim((ls.price * 100).toFixed(1)) + '¢</span> Polymarket' + (ls.price_t ? ' · read ' + ct(ls.price_t) + ' CT' : '') : '<span class="na">price n/a</span>') + '</div></div>' +
      '<div class="sc-units"><b class="num">' + (u == null ? 'n/a' : u + '<small>u</small>') + '</b><div class="sc-pips">' + pips + '</div></div></div>' +
      '<div class="sc-gates">' + gate(true, '<span class="num">' + trim((q.share_for * 100).toFixed(1)) + '%</span> of counted money (needs 60%)') +
      gate(true, '<span class="num">' + q.proven_for + '</span> proven for') + gate(true, '<span class="num">' + q.proven_against + '</span> proven against') +
      gate(true, '<span class="num">' + q.pressers_n15 + '</span> sized up' + (ls.top_press != null ? ', top <span class="num">' + ls.top_press + 'x</span>' : '')) + '</div>' +
      '<p class="sc-fine">Size comes from the biggest press on the side: 3x or more is 5u, 2x or more is 2u, otherwise 3u, and any side priced under 50¢ is capped at 1u. ' +
      'This rule is in its forward test and has no graded record yet.</p></div>';
  }
  /* no play: show how far the leading side is from the gates, using stored money and counts only */
  var lead = names.slice().sort(function(a, b){ return (nProven(S[b]) - nProven(S[a])) || (counted(S[b]) - counted(S[a])); })[0];
  var other = names.filter(function(n){ return n !== lead; })[0], tot = counted(S[lead]) + counted(S[other]);
  var share = tot ? counted(S[lead]) / tot : null, pf = nProven(S[lead]), pa = nProven(S[other]);
  var why = v === 'fwd' ? 'Forward only counts results from after a wallet was first tracked, and no wallet clears the bar on those alone yet.'
    : pf ? 'A proven wallet is here, but the side does not clear every gate.' : tot ? 'No wallet on this market has a graded book of 6 bets, 55% wins and +3% ROI yet. The ledger is still filling.' : 'No wallet holds $250 or more on this market yet.';
  return '<div class="sc-sig off"><div class="sc-sig1"><div class="sc-logo none">0u</div><div class="sc-hl"><div class="sc-eyebrow">Suggested units</div>' +
    '<div class="sc-side quiet">No play on the ' + GNAME[key] + '</div><div class="sc-price">' + why + '</div></div></div>' +
    (tot ? '<div class="sc-gates"><span class="sc-gl">' + esc(lead) + '</span>' +
      gate(share >= .6, '<span class="num">' + trim((share * 100).toFixed(1)) + '%</span> of counted money (needs 60%)') +
      gate(pf >= 1, '<span class="num">' + pf + '</span> proven for') + gate(pa === 0, '<span class="num">' + pa + '</span> proven against') +
      gate(null, 'sized up: n/a') + '</div>' : '') + '</div>';
}

function walletRow(w, k){
  var p = w.press, fill = p == null ? 0 : Math.min(p / 3, 1) * 100;
  return '<div class="sc-w ' + k + '"><span class="sc-wd">' + (w.star ? ICON.star : '<i></i>') + '</span><b class="num">' + tail(w.w) + '</b>' +
    '<span class="sc-wu num">' + usd(w.usd) + '</span>' +
    '<span class="sc-pm" title="position vs usual stake"><span class="tr"><i style="width:' + fill.toFixed(1) + '%"></i><u></u></span><em class="num">' + (p == null ? 'n/a' : p + 'x') + '</em></span>' +
    '<span class="sc-wr num">' + w.w_ + '-' + w.l_ + ' · L30 ' + roi(w.l30_roi) + ' · ' + susd(w.pnl) + '</span></div>';
}
function aggRow(k, t, v, note){ return '<div class="sc-w agg ' + k + '"><span class="sc-wd"><i></i></span><b>' + t + '</b><span class="sc-wu num">' + usd(v) + '</span><span class="sc-wr">' + (note || '') + '</span></div>'; }
function sideBlock(g, n, s){
  var sum = function(a){ return a.reduce(function(t, x){ return t + x.usd; }, 0); }, c = s.counts, p = s.proven, h = '';
  h += '<div class="sc-sd"><div class="sc-sdh">' + logo(n, g).replace('sc-logo', 'sc-logo sm') + '<b>' + esc(n) + '</b><span class="num">' + usd(counted(s)) + ' counted</span></div>';
  if (p.wallets){
    h += '<div class="sc-rec"><span><b class="num">' + (p.win_pct == null ? 'n/a' : p.win_pct + '%') + '</b> win</span><span><b class="num">' + p.w + '-' + p.l + '</b> record</span>' +
      '<span><b class="num">' + roi(p.l30_roi) + '</b> L30 ROI</span><span><b class="num">' + susd(p.lifetime_pnl) + '</b> lifetime</span></div>';
    if (p.last20.length) h += '<div class="sc-form" aria-label="last ' + p.last20.length + ' results">' + p.last20.map(function(r){ return '<i class="' + r + '"></i>'; }).join('') + '<span>LAST ' + p.last20.length + '</span></div>';
  }
  s.list.forEach(function(w){ h += walletRow(w, w.star ? 'hc' : 'sharp'); });
  var np = nProven(s);
  if (np > s.list.length) h += aggRow('sharp', '+' + (np - s.list.length) + ' more proven', Math.max(0, s.sharp_usd - sum(s.list)));
  if (!np) h += '<div class="sc-w none"><span class="sc-wd"><i></i></span><b>No proven wallets on this side</b></div>';
  s.losers.forEach(function(w){ h += walletRow(w, 'loser'); });
  if (c.loser > s.losers.length) h += aggRow('loser', '+' + (c.loser - s.losers.length) + ' more losers', Math.max(0, s.loser_usd - sum(s.losers)));
  if (c.unproven) h += aggRow('unp', c.unproven + ' unproven', s.unproven_usd);
  if (c.excluded) h += aggRow('exc', c.excluded + ' excluded', s.excluded_usd, 'not counted');
  return h + '</div>';
}

function body(g, st){
  var h = '<div class="sc-mks">' + GROUPS.map(function(x){ return marketRow(g, x[0], x[1], st); }).join('') + '</div>' +
    '<div class="sc-key"><span class="hc">sized up</span><span class="sharp">proven</span><span class="unp">unproven</span><span class="loser">losers</span><span class="exc">excluded</span></div>';
  var m = g.markets[st.group], names = sideOrder(g, m, st.group);
  h += signal(g, m, st.group, names, st.variant);
  h += '<div class="sc-lab"><span>Who holds each side</span><span>press vs usual stake</span></div><div class="sc-sides">' +
    names.map(function(n){ return sideBlock(g, n, m.sides[n][st.variant]); }).join('') + '</div>';
  var cv = g.coverage, bits = ['<b>Sharp money is context.</b> Units come from a rule still in its forward test. Money is mark value ' + (g.frozen ? 'at the lock' : 'now') + ' (shares x price), not cost.',
    cv.markets_read + ' markets read, ' + cv.markets_missed + ' missed' + (cv.late_reads ? ', ' + cv.late_reads + ' late' : '') + '.',
    'Oldest read ' + dur(cv.max_read_lag_s) + ' before ' + (g.frozen ? 'the lock' : 'this build') + '.', 'Ledger refreshed ' + ct(g.ledger_run_at) + ' CT.'];
  if (cv.two_way_dust_dropped) bits.push(cv.two_way_dust_dropped + ' two-way ' + (cv.two_way_dust_dropped === 1 ? 'wallet' : 'wallets') + ' dropped as balanced dust.');
  if (g.vault.start_gap_flag) bits.push('Start times differ by ' + g.vault.start_gap_min + ' min between Polymarket and Vault.');
  if (g.test) bits.push(g.test.counts ? 'Counts for the forward test.' : 'Does not count for the forward test: ' + g.test.why_not.join(', ') + '.');
  return h + '<div class="sc-foot">' + bits.join(' ') + '</div>';
}

/* one travelling pill per strip (vault-ds.css 19.2): seed without animation, then travel on --ease-rail */
function rail(strip, animate){
  var on = strip.querySelector('button.on'), pill = strip.querySelector('.v-pill');
  if (!on || !pill || !strip.offsetWidth) return;
  if (!animate || pill.style.opacity !== '1'){ strip.classList.add('rail-noanim'); }
  pill.style.left = on.offsetLeft + 'px'; pill.style.width = on.offsetWidth + 'px'; pill.style.opacity = '1';
  void pill.offsetWidth; strip.classList.remove('rail-noanim');
}

function mount(el, g, opt){
  opt = opt || {};
  var keys = GROUPS.filter(function(x){ return g.markets[x[0]]; }).map(function(x){ return x[0]; });
  var st = {group: keys.indexOf(opt.group) >= 0 ? opt.group : keys[0], variant: 'all'};
  var away = TEAMS[g.vault.away], home = TEAMS[g.vault.home];
  function head(){
    var c = climate(g, st.variant);
    return '<div class="sc-top"><div><div><span class="sc-sport">' + g.sport.toUpperCase() + '</span><span class="sc-match">' +
      esc(away ? away[0] : g.vault.away) + ' @ ' + esc(home ? home[0] : g.vault.home) + '</span></div><div class="sc-time num">' + ct(g.gst, true) + ' CT</div></div>' +
      '<div class="sc-tr"><span class="sc-clim ' + c + '"><i></i><i></i><i></i>' + CLIM[c] + '</span>' + (g.frozen
        ? '<div class="sc-pill locked">' + ICON.lock + 'LOCKED ' + ct(g.cut) + '</div>'
        : '<div class="sc-pill live"><i></i>LIVE · locks ' + ct(g.cut) + '</div>') + '</div></div>';
  }
  if (!keys.length){
    el.innerHTML = head() + '<div class="sc-empty"><b>Nothing to show yet</b><p>No wallet holds $250 or more on this game. The card fills in as money arrives and locks ' +
      ct(g.cut, true) + ' CT.</p></div><div class="sc-foot"><b>Sharp money is context.</b> ' + g.coverage.markets_read + ' market read, ' + g.coverage.markets_missed +
      ' missed. Ledger refreshed ' + ct(g.ledger_run_at) + ' CT.</div>';
    return;
  }
  el.innerHTML = '<div class="sc-hd"></div><div class="sc-ctl"><span class="sc-ctll">Wallet history</span><div class="vseg sm" data-k="variant" aria-label="History"><i class="v-pill"></i>' +
    '<button type="button" data-v="all" class="on">All history</button><button type="button" data-v="fwd">Forward only</button></div></div><div class="sc-body"></div>';
  var hd = el.querySelector('.sc-hd'), bodyEl = el.querySelector('.sc-body'), strips = [].slice.call(el.querySelectorAll('.vseg'));
  function paint(){ hd.innerHTML = head(); bodyEl.innerHTML = body(g, st); }
  paint(); strips.forEach(function(s){ rail(s, false); });
  el.addEventListener('click', function(e){
    var b = e.target.closest('.vseg > button'), mk = e.target.closest('button.sc-mk');
    if (b && !b.disabled){
      var strip = b.parentNode;
      [].forEach.call(strip.children, function(c){ c.classList.toggle('on', c === b); });
      st[strip.dataset.k] = b.dataset.v; rail(strip, true); paint();
    } else if (mk){ st.group = mk.dataset.g; paint(); }
  });
  el._repaint = function(){ paint(); strips.forEach(function(s){ rail(s, false); }); };
}

/* slate strip: totals over every game in the file, stored fields only */
function slate(el, data){
  var usdSum = 0, sides = 0, wallets = {}, cl = {quiet:0, building:0, signal:0}, plays = 0, ex = 0;
  data.games.forEach(function(g){
    cl[climate(g, 'all')]++;
    Object.keys(g.markets).forEach(function(k){ var m = g.markets[k]; if (shadow(m, 'all')) plays++;
      Object.keys(m.sides).forEach(function(n){ var s = m.sides[n].all; usdSum += s.sharp_usd; ex += s.excluded_usd; if (s.sharp_usd > 0) sides++;
        s.list.forEach(function(w){ wallets[w.w] = 1; }); }); });
  });
  var t = function(v, l, sub, cls){ return '<div class="sl-t ' + (cls || '') + '"><span>' + l + '</span><b class="num">' + v + '</b><em>' + sub + '</em></div>'; };
  el.innerHTML = t(usd(usdSum), 'Proven money on the slate', sides + ' sides · ' + Object.keys(wallets).length + ' proven wallets shown', 'gold') +
    t(plays, 'Suggested plays', 'sides that meet the tracked rule', 'good') +
    t(usd(ex), 'Excluded money', 'two-way and churn wallets, not counted') +
    '<div class="sl-t clim"><span>Sharp climate · ' + data.games.length + ' games</span><div class="sl-dots">' +
      ['signal', 'building', 'quiet'].map(function(k){ return new Array(cl[k] + 1).join('<i class="' + k + '"></i>'); }).join('') + '</div><em>' +
      cl.signal + ' signal · ' + cl.building + ' building · ' + cl.quiet + ' quiet</em></div>';
}

window.SideCard = {mount: mount, slate: slate};
})();

/* Mock gallery: every state is a real game from the sample. ?state=<id> shows one card. */
(function(){
var STATES = [
  {id:'proven',   ev:'nba-was-ind-2026-11-11', g:'ml',     cap:'Proven money, no play', note:'A proven wallet is on Wizards, but the side holds under 60% of the money, so the rule suggests nothing.'},
  {id:'star',     ev:'nba-den-mem-2026-11-11', g:'spread', cap:'Suggested units (the one play in the sample)', note:'Nuggets spread clears all four gates. The card shows the stored 3u, the price and why.'},

var q = new URLSearchParams(location.search), one = q.get('state'), th = q.get('theme');
if (th) document.documentElement.dataset.theme = th;
if (one) document.body.classList.add('single');
var grid = document.getElementById('grid'), cards = [];
STATES.forEach(function(s){

    b.onclick = function(){ document.documentElement.dataset.theme = b.dataset.v;
      [].forEach.call(tseg.querySelectorAll('button'), function(c){ c.classList.toggle('on', c === b); }); place(true); }; });
  var place = function(anim){ var on = tseg.querySelector('.on'), p = tseg.querySelector('.v-pill'); if (!anim) tseg.classList.add('rail-noanim');
    p.style.left = on.offsetLeft + 'px'; p.style.width = on.offsetWidth + 'px'; p.style.opacity = '1'; void p.offsetWidth; tseg.classList.remove('rail-noanim'); };

mq.addEventListener ? mq.addEventListener('change', rp) : mq.addListener(rp);

})();
