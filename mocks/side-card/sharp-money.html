<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Proven sharps side card · Sharp Money</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@500;600&display=swap">
<style>
/* Sharp Money skin. Desktop = the classic page (Halaska kit palette, Geist + Geist Mono, light and dark).
   Phone = the new/ layout (black page, #1c1c1e cards, 24px radius, Barlow Condensed numbers). One page, two files. */
:root{
  --c-bg:#1a1a1a;--c-card:#222222;--c-line:#2f2f2f;--c-line2:#3a3a3a;--c-ink:#d8d8d8;--c-mut:#999999;--c-dim:#6a6a6a;
  --c-good:#4ade80;--c-on-good:#0d2416;--c-bad:#f87171;--c-warn:#fbbf24;--c-gold:#e8c66a;
  --c-good-bg:rgba(74,222,128,.10);--c-good-line:rgba(74,222,128,.55);--c-good-box:rgba(74,222,128,.06);
  --c-bad-line:rgba(248,113,113,.5);--c-bad-box:rgba(248,113,113,.06);--c-box:#1d1d1d;--c-sel:rgba(216,216,216,.10);
  --c-rb-unp:#8a8f98;--c-tile:#f1f1f1;--c-tile-ink:#1a1a1a;
  --c-r:16px;--c-pad:22px;--c-sans:'Geist',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;--c-num:'Geist Mono','SF Mono',monospace;--c-num-ls:-.02em;
  --vseg-bg:#2a2a2a;--vseg-border:#3a3a3a;--vseg-ink:#999999;--vseg-on-ink:#1a1a1a;--vseg-pill:#d8d8d8;
  color-scheme:dark;
}
:root[data-theme=light]{
  --c-bg:#fafafa;--c-card:#ffffff;--c-line:#eeeeee;--c-line2:#dcdcdc;--c-ink:#2b2b2b;--c-mut:#777777;--c-dim:#a0a0a0;
  --c-good:#16a34a;--c-on-good:#ffffff;--c-bad:#dc2626;--c-warn:#d97706;--c-gold:#a8780a;
  --c-good-bg:#f0fdf4;--c-good-line:rgba(22,163,74,.5);--c-good-box:#f6fef9;--c-bad-line:rgba(220,38,38,.4);--c-bad-box:#fff7f7;--c-box:#fafafa;
  --c-sel:rgba(0,0,0,.07);--c-rb-unp:#b4b8bf;--c-tile:#f3f3f3;--c-tile-ink:#2b2b2b;--c-shadow:0 1px 2px rgba(0,0,0,.04);
  --vseg-bg:#f0f0f0;--vseg-border:#e5e5e5;--vseg-ink:#888888;--vseg-on-ink:#ffffff;--vseg-pill:#3d3d3d;
  color-scheme:light;
}
@media (max-width:767px){
  :root,:root[data-theme=light]{
    --c-bg:#0b0b0d;--c-card:#1c1c1e;--c-line:rgba(255,255,255,.09);--c-line2:rgba(255,255,255,.16);--c-ink:#fff;--c-mut:#98989f;--c-dim:#636366;
    --c-good:#32d583;--c-on-good:#04200f;--c-bad:#ff6b6b;--c-warn:#f5b84a;--c-gold:#f0cf7a;
    --c-good-bg:rgba(50,213,131,.12);--c-good-line:rgba(50,213,131,.55);--c-good-box:rgba(50,213,131,.07);
    --c-bad-line:rgba(255,107,107,.5);--c-bad-box:rgba(255,107,107,.07);--c-box:#161618;--c-sel:rgba(255,255,255,.10);
    --c-rb-unp:#8e8e93;--c-tile:#f2f2f7;--c-tile-ink:#000;--c-shadow:none;
    --c-r:24px;--c-pad:16px;--c-bw:0px;--c-gutter:16px;--c-sans:-apple-system,'SF Pro Text',Geist,system-ui,sans-serif;
    --c-num:'Barlow Condensed','SF Pro Rounded',Geist,sans-serif;--c-num-ls:.01em;
    --vseg-bg:#2c2c2e;--vseg-border:transparent;--vseg-ink:#98989f;--vseg-on-ink:#000;--vseg-pill:#fff;
    color-scheme:dark;
  }
  .sc-stat b{font-size:23px}.sc-box .big{font-size:24px}.sc-box .ln{font-size:17px}.sc-box .pc{font-size:16px}
  .sc-row b .num{font-size:16px}.sc-row>span.num,.sc-row b small.num{font-size:13px}.sc-time{font-size:15px}.sc-side{font-size:22px}.sc-amt b{font-size:28px}
  #theme{display:none}
}
html,body{margin:0;background:var(--c-bg);color:var(--c-ink);font-family:var(--c-sans);-webkit-font-smoothing:antialiased}

/* Proven-sharps side card. Shared by both mocks; each page sets the --c-* skin tokens.
   Motion tokens and .vseg are inlined from vault-ds.css (sections 19 and 20) because standalone mocks cannot link it. */
:root{
  --ease-out:cubic-bezier(0.16,1,0.3,1);
  --ease-rail:cubic-bezier(0.65,0,0.35,1);
  --ease-spring:cubic-bezier(0.34,1.56,0.64,1);
  --dur-press:80ms; --dur-release:500ms; --dur-rail:400ms;
  --press-chip:.88; --press-btn:.94; --press-card:.975; --press-row:.99;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}

/* press primitive (vault-ds.css 19.1) */
.press{transition:transform var(--dur-release) var(--ease-spring)}
.press:active{transform:scale(var(--press-scale,.94));transition:transform var(--dur-press) ease-out}
.press-chip{--press-scale:var(--press-chip)}.press-card{--press-scale:var(--press-card)}

/* .vseg (vault-ds.css 20), retinted through the vars only */
.vseg{position:relative;display:inline-flex;align-items:center;flex-shrink:0;gap:2px;padding:3px;max-width:100%;
  background:var(--vseg-bg);border:1px solid var(--vseg-border);border-radius:9px}
.vseg>button{position:relative;z-index:1;display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:32px;padding:0 14px;
  border:0;background:transparent;border-radius:6px;color:var(--vseg-ink);font-family:var(--c-sans);font-size:12.5px;font-weight:600;
  letter-spacing:-.01em;white-space:nowrap;cursor:pointer;transition:color .12s ease}
.vseg>button.on{color:var(--vseg-on-ink)}
.vseg>button:disabled{opacity:.38;cursor:default}
.vseg.sm>button{min-height:26px;padding:0 10px;font-size:11.5px}
.vseg .v-pill{position:absolute;z-index:0;top:3px;bottom:3px;left:0;width:0;border-radius:6px;background:var(--vseg-pill);opacity:0;
  transition:left var(--dur-rail) var(--ease-rail),width var(--dur-rail) var(--ease-rail)}
.vseg.rail-noanim .v-pill{transition:none}
@media (max-width:767px){
  .vseg>button{min-height:36px}.vseg.sm>button{min-height:30px}
  .vseg>button::after{content:"";position:absolute;inset:-4px 0}
}

/* ── the card ── */
.sc{background:var(--c-card);border:var(--c-bw,1px) solid var(--c-line);border-radius:var(--c-r);padding:var(--c-pad);color:var(--c-ink);
  font-family:var(--c-sans);font-size:14px;line-height:1.35;min-width:0;box-shadow:var(--c-shadow,none)}
.sc .num{font-family:var(--c-num);font-variant-numeric:tabular-nums;letter-spacing:var(--c-num-ls,0)}
.sc-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.sc-sport{color:var(--c-gold);font-weight:700;letter-spacing:.14em;font-size:11.5px;margin-right:8px}
.sc-match{color:var(--c-mut);font-size:15px;font-weight:500}
.sc-time{color:var(--c-dim);font-size:13.5px;margin-top:4px;letter-spacing:.02em}
.sc-pill{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 12px;border-radius:99px;font-size:11px;font-weight:700;
  letter-spacing:.1em;white-space:nowrap;flex:none}
.sc-pill.live{color:var(--c-mut);border:1px solid var(--c-line2)}
.sc-pill.live i{width:7px;height:7px;border-radius:50%;background:var(--c-warn);animation:sc-pulse 1.8s ease-in-out infinite}
.sc-pill.locked{background:var(--c-good);color:var(--c-on-good)}
.sc-pill svg{width:12px;height:12px}
.sc-pillsub{color:var(--c-dim);font-size:11.5px;text-align:right;margin-top:5px;white-space:nowrap}
@keyframes sc-pulse{50%{opacity:.25}}

.sc-ctl{display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;align-items:center;margin-top:14px}

.sc-head{display:flex;align-items:center;gap:14px;margin-top:18px}
.sc-logo{width:56px;height:56px;border-radius:14px;background:var(--c-tile);display:grid;place-items:center;flex:none;overflow:hidden;
  font-weight:700;font-size:15px;color:var(--c-tile-ink);letter-spacing:.02em}
.sc-logo img{width:78%;height:78%;object-fit:contain}
.sc-logo.none{background:transparent;border:1.5px dashed var(--c-line2);color:var(--c-dim)}
.sc-hl{flex:1;min-width:0}
.sc-eyebrow{font-size:10.5px;font-weight:600;letter-spacing:.14em;color:var(--c-dim);text-transform:uppercase}
.sc-side{font-size:30px;font-weight:700;letter-spacing:-.03em;line-height:1.08;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sc-side.quiet{font-size:22px;color:var(--c-mut);letter-spacing:-.02em}
.sc-price{color:var(--c-mut);font-size:14px;margin-top:3px}
.sc-price .na{color:var(--c-dim)}
.sc-amt{text-align:right;flex:none}
.sc-amt b{display:block;font-size:30px;font-weight:700;letter-spacing:-.03em;line-height:1.08;color:var(--c-gold)}
.sc-amt b.zero{color:var(--c-dim)}
.sc-amt span{display:block;font-size:12.5px;color:var(--c-good);margin-top:3px;font-weight:500}
.sc-amt b.zero+span{color:var(--c-dim)}

.sc-lab{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:10.5px;font-weight:600;letter-spacing:.16em;
  color:var(--c-dim);text-transform:uppercase;margin:20px 0 9px}
.sc-lab em{font-style:normal;letter-spacing:.02em;text-transform:none;font-weight:500;font-size:12px;color:var(--c-mut)}

.sc-stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr))}
.sc-stat{padding:10px 12px;border-left:1px solid var(--c-line)}
.sc-stat:first-child{border-left:0;background:var(--c-good-bg);border-radius:10px}
.sc-stat:nth-child(2){border-left:0}
.sc-stat b{display:block;font-size:22px;font-weight:600;letter-spacing:-.02em;white-space:nowrap}
.sc-stat b small{font-size:.55em;font-weight:600;margin-left:1px}
.sc-stat b.na{color:var(--c-dim);font-weight:500}
.sc-stat span{display:block;font-size:10px;font-weight:600;letter-spacing:.14em;color:var(--c-dim);margin-top:3px}
.sc-dots{display:flex;align-items:center;gap:5px;margin-top:11px}
.sc-dots i{width:7px;height:7px;border-radius:50%;background:var(--c-dim);flex:none}
.sc-dots i.W{background:var(--c-good)}.sc-dots i.L{background:var(--c-bad)}
.sc-dots span{font-size:10px;font-weight:600;letter-spacing:.14em;color:var(--c-dim);margin-left:8px;white-space:nowrap}

.sc-none{border:1px dashed var(--c-line2);border-radius:12px;padding:13px 14px;display:flex;gap:12px;align-items:flex-start}
.sc-none svg{width:18px;height:18px;flex:none;color:var(--c-dim);margin-top:1px}
.sc-none b{display:block;font-size:14px;font-weight:600}
.sc-none p{margin:3px 0 0;font-size:12.5px;color:var(--c-mut);line-height:1.45}

/* wallets → where it went */
.sc-flow{display:flex;flex-direction:column;gap:14px}
.sc-blk{display:grid;grid-template-columns:minmax(0,1fr) var(--sk-w) minmax(0,var(--box-w));align-items:center}
.sc-rows{display:flex;flex-direction:column;min-width:0}
.sc-row{height:var(--row-h);display:flex;flex-direction:column;justify-content:center;min-width:0}
.sc-row b{font-size:14.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:5px}
.sc-row b small{font-weight:500;font-size:11.5px;color:var(--c-mut)}
.sc-row b svg{width:13px;height:13px;flex:none;color:var(--c-gold)}
.sc-row.hc b{color:var(--c-gold)}
.sc-row.agg b{font-weight:600}
.sc-row.exc b,.sc-row.unp b{color:var(--c-mut)}
.sc-row>span{font-size:12px;color:var(--c-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sc-sk{display:block;width:var(--sk-w);overflow:visible}
.sc-sk .rail{stroke:var(--c-line2);stroke-width:1}
.sc-sk .rb{opacity:.9}
.sc-sk .rb.hc{fill:var(--c-gold)}.sc-sk .rb.sharp{fill:var(--c-good)}.sc-sk .rb.unp{fill:var(--c-rb-unp)}
.sc-sk .rb.loser{fill:var(--c-bad)}.sc-sk .rb.exc{fill:none;stroke:var(--c-dim);stroke-width:1.2;stroke-dasharray:3 3}
.sc-sk circle{fill:var(--c-card);stroke-width:2}
.sc-sk circle.hc{stroke:var(--c-gold)}.sc-sk circle.sharp{stroke:var(--c-good);fill:var(--c-good)}
.sc-sk circle.unp{stroke:var(--c-rb-unp)}.sc-sk circle.loser{stroke:var(--c-bad)}.sc-sk circle.exc{stroke:var(--c-dim);stroke-dasharray:2 2}

.sc-box{all:unset;box-sizing:border-box;cursor:pointer;display:flex;flex-direction:column;justify-content:center;min-height:var(--box-h);
  align-self:stretch;border:1.5px solid var(--c-line2);border-radius:18px;padding:12px 14px;background:var(--c-box);min-width:0}
.sc-box:focus-visible{outline:2px solid var(--c-ink);outline-offset:2px}
.sc-box.good{border-color:var(--c-good-line);background:var(--c-good-box)}
.sc-box.bad{border-color:var(--c-bad-line);background:var(--c-bad-box)}
.sc-box.sel{box-shadow:0 0 0 3px var(--c-sel)}
.sc-box u{text-decoration:none;font-size:10.5px;font-weight:600;letter-spacing:.16em;color:var(--c-dim);text-transform:uppercase;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sc-box .big{font-size:22px;font-weight:700;letter-spacing:-.02em;line-height:1.15;margin-top:2px}
.sc-box .big small,.sc-box .ln small{font-family:var(--c-sans);font-size:12.5px;font-weight:500;letter-spacing:.01em;color:var(--c-mut);margin-left:4px}
.sc-box .big.zero{color:var(--c-dim)}
.sc-box .big.red{color:var(--c-bad)}
.sc-box .pc{font-size:14px;font-weight:600;line-height:1.2}
.sc-box .pc small{display:block;font-family:var(--c-sans);font-weight:500;font-size:12px;color:var(--c-mut)}
.sc-box .ln{font-size:16px;font-weight:700;letter-spacing:-.01em;line-height:1.3}
.sc-box .ln.red,.sc-box .ln.red small{color:var(--c-bad)}
.sc-box .ln.dim,.sc-box .ln.dim small{color:var(--c-dim);font-weight:600}
.sc-mix{display:flex;height:4px;border-radius:2px;overflow:hidden;margin-top:9px;background:var(--c-line)}
.sc-mix i{display:block;height:100%}
.sc-mix .sharp{background:var(--c-good)}.sc-mix .hc{background:var(--c-gold)}.sc-mix .unp{background:var(--c-rb-unp)}.sc-mix .loser{background:var(--c-bad)}
.sc-mix .exc{background:repeating-linear-gradient(90deg,var(--c-dim) 0 2px,transparent 2px 4px)}

.sc-rule{margin-top:14px;border:1px dashed var(--c-line2);border-radius:12px;font-size:12.5px;color:var(--c-mut)}
.sc-rule summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:8px;padding:9px 12px;font-weight:600;color:var(--c-mut)}
.sc-rule summary::-webkit-details-marker{display:none}
.sc-rule summary svg{width:13px;height:13px;flex:none}
.sc-rule summary span{margin-left:auto;font-weight:500;color:var(--c-dim);font-size:11.5px}
.sc-rule p{margin:0;padding:0 12px 11px;line-height:1.5}

.sc-foot{margin-top:16px;padding-top:12px;border-top:1px solid var(--c-line);font-size:11.5px;color:var(--c-dim);line-height:1.55}
.sc-foot b{color:var(--c-mut);font-weight:600}
.sc-empty{margin-top:18px;border:1px dashed var(--c-line2);border-radius:14px;padding:22px 16px;text-align:center}
.sc-empty b{display:block;font-size:15px;font-weight:600}
.sc-empty p{margin:5px auto 0;font-size:13px;color:var(--c-mut);max-width:34ch;line-height:1.45}

@media (max-width:767px){
  .sc-side{font-size:26px}.sc-amt b{font-size:26px}.sc-side.quiet{font-size:19px}
  .sc-logo{width:48px;height:48px;border-radius:12px}
  .sc-head{gap:11px}
  .sc-side{white-space:normal;overflow:visible}
  .sc-amt{max-width:112px}.sc-amt span{font-size:11.5px;line-height:1.25}.sc-eyebrow{white-space:nowrap;letter-spacing:.1em}
  .sc-price{font-size:13px;line-height:1.3}.sc-row .px{display:none}
  .sc-stat{padding:9px 8px}.sc-stat b{font-size:18px}.sc-stat span{font-size:9px;letter-spacing:.1em}
  .sc-row b{font-size:13.5px}.sc-row>span{font-size:11px;white-space:normal;line-height:1.25}
  .sc-box{padding:10px 11px;border-radius:16px}
  .sc-box .big{font-size:20px}.sc-box .ln{font-size:14.5px}
  .sc-box .big small,.sc-box .ln small{font-size:11.5px;margin-left:3px}
}
@media (prefers-reduced-motion:reduce){
  .press,.press:active{transition:none;transform:none}
  .vseg .v-pill{transition:none}
  .sc-pill.live i{animation:none}
}

/* ── gallery chrome (mock only) ── */
.mk{max-width:1180px;margin:0 auto;padding:28px 24px 80px}
.mk-h{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:14px;margin-bottom:6px}
.mk-h h1{margin:0;font-size:24px;font-weight:700;letter-spacing:-.02em}
.mk-h p{margin:4px 0 0;color:var(--c-mut);font-size:13.5px;max-width:70ch}
.mk-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:30px 28px;margin-top:22px;align-items:start}
.mk-cell{min-width:0}
.mk-cap{margin:0 2px 9px;font-size:12px;color:var(--c-mut);line-height:1.4}
.mk-cap b{color:var(--c-ink);font-weight:600;font-size:13px;display:block}
body.single .mk-grid{grid-template-columns:minmax(0,560px);justify-content:center}
@media (max-width:900px){.mk-grid{grid-template-columns:minmax(0,1fr)}}
@media (max-width:767px){.mk{padding:14px 0 60px}.mk-h{padding:0 16px}.mk-h h1{font-size:20px}.mk-cap{margin:0 20px 8px}.mk-grid{gap:22px;margin-top:14px}
  .mk-cell .sc{margin:0 var(--c-gutter,12px)}}

</style></head>
<body>
<div class="mk">
  <div class="mk-h"><div><h1>Proven sharps side card · Sharp Money</h1><p>Game page card in Sharp Money's look. At desktop width it uses the classic page's palette; at phone width it uses the new/ layout. Every card is a real game from the live sample. Context only: no units, no pick.</p></div>
    <div class="vseg sm" id="theme" aria-label="Theme"><i class="v-pill"></i><button type="button" data-v="dark">Dark</button><button type="button" data-v="light">Light</button></div></div>

  if (tot > 0){
    var seg = function(k, v){ return v > 0 ? '<i class="' + k + '" style="width:' + (v / tot * 100).toFixed(2) + '%"></i>' : ''; };
    h += '<div class="sc-mix">' + seg('hc', s.hc_usd) + seg('sharp', s.sharp_usd - s.hc_usd) + seg('unp', s.unproven_usd) + seg('loser', s.loser_usd) + seg('exc', s.excluded_usd) + '</div>';
  }
  return h + '</button>';
}

function body(g, st){
  var m = g.markets[st.group], names = sideOrder(g, m, st.group), v = st.variant, ls = (m.lock_shadow || {})[v] || {};
  var S = {}; names.forEach(function(n){ S[n] = m.sides[n][v]; });
  var top = names.slice().sort(function(a, b){ return S[b].sharp_usd - S[a].sharp_usd; })[0];
  var auto = S[top].sharp_usd > 0 ? top : null, pick = st.side && S[st.side] ? st.side : auto, s = pick ? S[pick] : null;
  var when = g.frozen ? 'at the lock' : 'as of ' + ct(g.built) + ' CT';
  var h = '';

  /* headline: the side, its price, and the proven money on it (where SharpFlow puts units) */
  if (pick){
    var price = ls.side === pick && ls.price != null
      ? '<span class="num">' + trim((ls.price * 100).toFixed(1)) + '¢</span> Polymarket' + (ls.price_t ? ' · read ' + ct(ls.price_t) + ' CT' : '')
      : '<span class="na">price n/a</span>';
    h += '<div class="sc-head">' + logo(pick, g) + '<div class="sc-hl"><div class="sc-eyebrow">' + (pick === auto ? 'Most proven money' : 'Selected side') + '</div>' +
      '<div class="sc-side">' + esc(sideLabel(pick, st.group, ls)) + '</div><div class="sc-price">' + price + '</div></div>' +
      '<div class="sc-amt"><b class="num' + (s.sharp_usd > 0 ? '' : ' zero') + '">' + usd(s.sharp_usd) + '</b><span>proven, mark value ' + (g.frozen ? 'at the lock' : 'now') + '</span></div></div>';
  } else {
    h += '<div class="sc-head"><div class="sc-logo none">$0</div><div class="sc-hl"><div class="sc-eyebrow">' + GNAME[st.group] + '</div>' +
      '<div class="sc-side quiet">No proven money yet</div><div class="sc-price">on either side, ' + when + '</div></div></div>';
  }

  /* combined proven sharps */
  h += '<div class="sc-lab"><span>Combined proven sharps</span>' + (s && s.proven.wallets ? '<em>' + s.proven.wallets + (s.proven.wallets === 1 ? ' wallet' : ' wallets') + ' on ' + esc(pick) + '</em>' : '') + '</div>';
  if (s && s.proven.wallets){
    var p = s.proven, pc = function(x){ return x.replace('%', '<small>%</small>'); };
    h += '<div class="sc-stats">' +
      '<div class="sc-stat"><b class="num' + (p.win_pct == null ? ' na' : '') + '">' + (p.win_pct == null ? 'n/a' : pc(p.win_pct + '%')) + '</b><span>WIN</span></div>' +
      '<div class="sc-stat"><b class="num' + (p.l30_roi == null ? ' na' : '') + '">' + pc(roi(p.l30_roi)) + '</b><span>L30 ROI</span></div>' +
      '<div class="sc-stat"><b class="num' + (p.lifetime_pnl == null ? ' na' : '') + '">' + susd(p.lifetime_pnl) + '</b><span>LIFETIME</span></div>' +
      '<div class="sc-stat"><b class="num">' + p.w + '-' + p.l + '</b><span>RECORD</span></div></div>';
    h += '<div class="sc-dots">' + (p.last20.length ? p.last20.map(function(r){ return '<i class="' + r + '" title="' + r + '"></i>'; }).join('') + '<span>LAST ' + p.last20.length + '</span>' : '<span style="margin-left:0">LAST 20 n/a</span>') + '</div>';
  } else {
    var held = names.reduce(function(t, n){ var c = S[n].counts; return t + c.hc + c.sharp + c.unproven + c.loser + c.excluded; }, 0);
    var msg = v === 'fwd'
      ? 'Forward only counts results from after a wallet was first tracked. No wallet on ' + (pick ? esc(pick) : 'this market') + ' clears the bar on those results alone yet.'
      : held ? held + (held === 1 ? ' wallet holds' : ' wallets hold') + ' this market at $250 or more. None ' + (pick ? 'on ' + esc(pick) + ' ' : '') +
          'has a graded NBA book that clears 6 bets, 55% wins and +3% ROI. The ledger is still filling.'
        : 'No wallet holds $250 or more on this market yet.';
    h += '<div class="sc-none">' + ICON.hour + '<div><b>' + (pick ? 'No proven wallets on ' + esc(pick) : 'No proven wallets here yet') + '</b><p>' + msg + '</p></div></div>';
  }

  /* wallets -> where it went */
  var ph = phone(), rowH = ph ? 56 : 46, W = ph ? 54 : 100, boxH = ph ? 150 : 150;
  var maxTot = Math.max.apply(null, names.map(function(n){ var x = S[n]; return x.sharp_usd + x.unproven_usd + x.loser_usd + x.excluded_usd; })) || 1;
  h += '<div class="sc-lab"><span>Wallets</span><span>Where it went</span></div><div class="sc-flow" style="--row-h:' + rowH + 'px;--sk-w:' + W + 'px;--box-h:' + boxH + 'px;--box-w:' + (ph ? '47%' : '212px') + '">';
  names.forEach(function(n){
    var rows = rowsOf(S[n]);
    if (!rows.length) rows = [{k:'exc', agg:1, t:'No holders', usd:0, note:'none at $250+'}];
    var listH = rows.length * rowH, H = Math.max(listH, boxH), topY = (H - listH) / 2;
    h += '<div class="sc-blk"><div class="sc-rows">' + rows.map(rowHtml).join('') + '</div>' + sankey(rows, H, topY, rowH, W, (ph ? 22 : 30) / maxTot) + boxHtml(n, S[n], n === pick) + '</div>';
  });
  h += '</div>';

  /* tracked rule: a small labelled marker only. No units, no price target. */
  if (ls.side && ls.gates){
    var q = ls.gates;
    h += '<details class="sc-rule"><summary>' + ICON.flag + 'Tracked rule (forward test)<span>' + esc(ls.side) + ' · details</span></summary><p>As of ' + (g.frozen ? 'the lock' : 'this read') + ', ' + esc(ls.side) +
      ' meets the pre-registered gates: <span class="num">' + trim((q.share_for * 100).toFixed(1)) + '%</span> of counted money, <span class="num">' + q.proven_for +
      '</span> proven for, <span class="num">' + q.proven_against + '</span> proven against, <span class="num">' + q.pressers_n15 +
      '</span> wallet at 1.5x or more of its usual stake. It is recorded so the rule can be graded later. It is not a pick.</p></details>';
  }

  var cv = g.coverage, bits = ['<b>Context, not a bet.</b> Money is mark value ' + (g.frozen ? 'at the lock' : 'now') + ' (shares x price), not cost.',
    cv.markets_read + ' markets read, ' + cv.markets_missed + ' missed' + (cv.late_reads ? ', ' + cv.late_reads + ' late' : '') + '.',
    'Oldest read ' + dur(cv.max_read_lag_s) + ' before ' + (g.frozen ? 'the lock' : 'this build') + '.',
    'Ledger refreshed ' + ct(g.ledger_run_at) + ' CT.'];
  if (cv.two_way_dust_dropped) bits.push(cv.two_way_dust_dropped + ' two-way ' + (cv.two_way_dust_dropped === 1 ? 'wallet' : 'wallets') + ' dropped as balanced dust.');
  if (g.vault.start_gap_flag) bits.push('Start times differ by ' + g.vault.start_gap_min + ' min between Polymarket and Vault.');
  if (g.test) bits.push(g.test.counts ? 'Counts for the forward test.' : 'Does not count for the forward test: ' + g.test.why_not.join(', ') + '.');
  return h + '<div class="sc-foot">' + bits.join(' ') + '</div>';
}

/* one travelling pill per strip (vault-ds.css 19.2): seed without animation, then travel on --ease-rail */
function rail(strip, animate){
  var on = strip.querySelector('button.on'), pill = strip.querySelector('.v-pill');
  if (!on || !pill || !strip.offsetWidth) return;
  if (!animate || pill.style.opacity !== '1'){ strip.classList.add('rail-noanim'); }
  pill.style.left = on.offsetLeft + 'px'; pill.style.width = on.offsetWidth + 'px'; pill.style.opacity = '1';
  void pill.offsetWidth; strip.classList.remove('rail-noanim');
}

function mount(el, g, opt){
  opt = opt || {};
  var keys = GROUPS.filter(function(x){ return g.markets[x[0]]; }).map(function(x){ return x[0]; });
  var st = {group: keys.indexOf(opt.group) >= 0 ? opt.group : keys[0], variant: 'all', side: null};
  var away = TEAMS[g.vault.away], home = TEAMS[g.vault.home];
  var head = '<div class="sc-top"><div><div><span class="sc-sport">' + g.sport.toUpperCase() + '</span><span class="sc-match">' +
    esc(away ? away[0] : g.vault.away) + ' @ ' + esc(home ? home[0] : g.vault.home) + '</span></div><div class="sc-time num">' + ct(g.gst, true) + ' CT</div></div>' +
    '<div>' + (g.frozen
      ? '<div class="sc-pill locked">' + ICON.lock + 'LOCKED</div><div class="sc-pillsub">frozen ' + ct(g.cut) + ' CT</div>'
      : '<div class="sc-pill live"><i></i>LIVE</div><div class="sc-pillsub">locks ' + ct(g.cut) + ' CT</div>') + '</div></div>';
  if (!keys.length){
    el.innerHTML = head + '<div class="sc-empty"><b>Nothing to show yet</b><p>No wallet holds $250 or more on this game. The card fills in as money arrives and locks ' +
      ct(g.cut, true) + ' CT.</p></div><div class="sc-foot"><b>Context, not a bet.</b> ' + g.coverage.markets_read + ' market read, ' + g.coverage.markets_missed +
      ' missed. Ledger refreshed ' + ct(g.ledger_run_at) + ' CT.</div>';
    return;
  }
  el.innerHTML = head + '<div class="sc-ctl"><div class="vseg" data-k="group" role="tablist" aria-label="Market"><i class="v-pill"></i>' +
    GROUPS.map(function(x){ return '<button type="button" data-v="' + x[0] + '"' + (g.markets[x[0]] ? '' : ' disabled') + (x[0] === st.group ? ' class="on"' : '') + '>' + x[1] + '</button>'; }).join('') +
    '</div><div class="vseg sm" data-k="variant" aria-label="History"><i class="v-pill"></i><button type="button" data-v="all" class="on">All history</button><button type="button" data-v="fwd">Forward only</button></div></div><div class="sc-body"></div>';
  var bodyEl = el.querySelector('.sc-body'), strips = [].slice.call(el.querySelectorAll('.vseg'));
  function paint(){ bodyEl.innerHTML = body(g, st); }
  paint(); strips.forEach(function(s){ rail(s, false); });
  el.addEventListener('click', function(e){
    var b = e.target.closest('.vseg > button'), box = e.target.closest('.sc-box');
    if (b && !b.disabled){
      var strip = b.parentNode;
      [].forEach.call(strip.children, function(c){ c.classList.toggle('on', c === b); });
      st[strip.dataset.k] = b.dataset.v; if (strip.dataset.k === 'group') st.side = null;
      rail(strip, true); paint();
    } else if (box){ st.side = box.dataset.side; paint(); }
  });
  el._repaint = function(){ paint(); strips.forEach(function(s){ rail(s, false); }); };
}

window.SideCard = {mount: mount};
})();

/* Mock gallery: every state is a real game from the sample. ?state=<id> shows one card. */
(function(){
var STATES = [
  {id:'proven',   ev:'nba-was-ind-2026-11-11', g:'ml',     cap:'Proven money on one side', note:'One proven wallet on Wizards. Pacers carry a loser wallet, Wizards carry excluded money.'},
  {id:'star',     ev:'nba-den-mem-2026-11-11', g:'spread', cap:'Spread, a sized-up wallet (gold star) and the tracked-rule marker', note:'The only game in the sample that meets the pre-registered gates. The marker stays small and collapsed.'},
  {id:'total',    ev:'nba-den-mem-2026-11-11', g:'total',  cap:'Total (Over and Under)', note:'Proven money on the Over, excluded money on the Under.'},
  {id:'none',     ev:'nba-gsw-hou-2026-11-11', g:'ml',     cap:'No proven money (the common case today)', note:'The stats block becomes one quiet panel that says why. The money flow still has real content.'},
  {id:'losers',   ev:'nba-bos-tor-2026-11-11', g:'ml',     cap:'Loser-heavy side', note:'Five loser wallets on Celtics, one proven wallet on Raptors.'},
  {id:'excluded', ev:'nba-orl-uta-2026-11-11', g:'spread', cap:'Excluded-heavy side', note:'Most of the Magic money is excluded. It is drawn dashed and never counted.'},
  {id:'frozen',   ev:'nba-cle-nyk-2026-11-11', g:'spread', frozen:1, cap:'Frozen at the lock', note:'Real card data. The sample has no frozen card yet, so the mock sets the frozen flag to show the locked state.'},
  {id:'thin',     ev:'nba-okc-lac-2026-11-13', g:'ml',     cap:'Two days out, thin money', note:'Only the moneyline has been read. Spread and Total are disabled.'},
  {id:'empty',    ev:'nba-mil-orl-2026-11-13', g:'ml',     cap:'Nothing read yet', note:'A game with no holders at $250 or more.'}
];
var q = new URLSearchParams(location.search), one = q.get('state'), th = q.get('theme');
if (th) document.documentElement.dataset.theme = th;
if (one) document.body.classList.add('single');
var grid = document.getElementById('grid'), cards = [];
STATES.forEach(function(s){
  if (one && one !== s.id) return;
  var g = JSON.parse(JSON.stringify(SIDE_SAMPLE.games.filter(function(x){ return x.ev === s.ev; })[0]));
  if (s.frozen){ g.frozen = true; }
  var cell = document.createElement('div'); cell.className = 'mk-cell'; cell.id = s.id;
  cell.innerHTML = '<p class="mk-cap"><b>' + s.cap + '</b>' + s.note + '</p><div class="sc"></div>';
  grid.appendChild(cell); SideCard.mount(cell.lastChild, g, {group: s.g}); cards.push(cell.lastChild);
});
var tseg = document.getElementById('theme');
if (tseg){
  var cur = document.documentElement.dataset.theme || 'dark';
  [].forEach.call(tseg.querySelectorAll('button'), function(b){ b.classList.toggle('on', b.dataset.v === cur);
    b.onclick = function(){ document.documentElement.dataset.theme = b.dataset.v;
      [].forEach.call(tseg.querySelectorAll('button'), function(c){ c.classList.toggle('on', c === b); }); place(true); }; });
  var place = function(anim){ var on = tseg.querySelector('.on'), p = tseg.querySelector('.v-pill'); if (!anim) tseg.classList.add('rail-noanim');
    p.style.left = on.offsetLeft + 'px'; p.style.width = on.offsetWidth + 'px'; p.style.opacity = '1'; void p.offsetWidth; tseg.classList.remove('rail-noanim'); };
  place(false);
}
var mq = matchMedia('(max-width:767px)'), rp = function(){ cards.forEach(function(c){ c._repaint && c._repaint(); }); };
mq.addEventListener ? mq.addEventListener('change', rp) : mq.addListener(rp);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(rp);
})();

</script>
