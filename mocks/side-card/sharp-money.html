<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Proven sharps side card · Sharp Money</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@500;600&display=swap">
<style>
/* Sharp Money skin. Desktop = the classic page (Halaska kit palette, Geist + Geist Mono, light and dark).
   Phone = the new/ layout (black page, #1c1c1e cards, 24px radius, Barlow Condensed numbers). One page, two files. */
:root{
  --c-bg:#1a1a1a;--c-card:#222222;--c-line:#2f2f2f;--c-line2:#3a3a3a;--c-ink:#d8d8d8;--c-mut:#999999;--c-dim:#6a6a6a;
  --c-good:#4ade80;--c-on-good:#0d2416;--c-bad:#f87171;--c-warn:#fbbf24;--c-gold:#e8c66a;
  --c-good-bg:rgba(74,222,128,.10);--c-good-line:rgba(74,222,128,.55);--c-good-box:rgba(74,222,128,.06);
  --c-bad-line:rgba(248,113,113,.5);--c-bad-box:rgba(248,113,113,.06);--c-box:#2a2a2a;--c-sel:rgba(216,216,216,.10);
  --c-rb-unp:#8a8f98;--c-tile:#f1f1f1;--c-tile-ink:#1a1a1a;
  --c-r:16px;--c-pad:22px;--c-sans:'Geist',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;--c-num:'Geist Mono','SF Mono',monospace;--c-num-ls:-.02em;
  --vseg-bg:#2a2a2a;--vseg-border:transparent;--vseg-ink:#999999;--vseg-on-ink:#1a1a1a;--vseg-pill:#d8d8d8;
  color-scheme:dark;
}
:root[data-theme=light]{
  --c-bg:#fafafa;--c-card:#ffffff;--c-line:#eeeeee;--c-line2:#dcdcdc;--c-ink:#2b2b2b;--c-mut:#777777;--c-dim:#a0a0a0;
  --c-good:#16a34a;--c-on-good:#ffffff;--c-bad:#dc2626;--c-warn:#d97706;--c-gold:#a8780a;
  --c-good-bg:#f0fdf4;--c-good-line:rgba(22,163,74,.5);--c-good-box:#f0fdf4;--c-bad-line:rgba(220,38,38,.4);--c-bad-box:#fff7f7;--c-box:#f5f5f5;
  --c-sel:rgba(0,0,0,.07);--c-rb-unp:#b4b8bf;--c-tile:#f3f3f3;--c-tile-ink:#2b2b2b;--c-shadow:0 1px 2px rgba(0,0,0,.04);
  --vseg-bg:#f0f0f0;--vseg-border:#e5e5e5;--vseg-ink:#888888;--vseg-on-ink:#ffffff;--vseg-pill:#3d3d3d;
  color-scheme:light;
}
@media (max-width:767px){
  :root,:root[data-theme=light]{
    --c-bg:#0b0b0d;--c-card:#1c1c1e;--c-line:rgba(255,255,255,.09);--c-line2:rgba(255,255,255,.16);--c-ink:#fff;--c-mut:#98989f;--c-dim:#636366;
    --c-good:#32d583;--c-on-good:#04200f;--c-bad:#ff6b6b;--c-warn:#f5b84a;--c-gold:#f0cf7a;
    --c-mr:18px;--c-box:#2c2c2e;--c-good-bg:rgba(50,213,131,.12);--c-good-line:rgba(50,213,131,.55);--c-good-box:rgba(50,213,131,.07);
    --c-bad-line:rgba(255,107,107,.5);--c-bad-box:rgba(255,107,107,.07);--c-sel:rgba(255,255,255,.10);
    --c-rb-unp:#8e8e93;--c-tile:#f2f2f7;--c-tile-ink:#000;--c-shadow:none;
    --c-r:24px;--c-pad:16px;--c-bw:0px;--c-gutter:16px;--c-sans:-apple-system,'SF Pro Text',Geist,system-ui,sans-serif;
    --c-num:'Barlow Condensed','SF Pro Rounded',Geist,sans-serif;--c-num-ls:.01em;
    --vseg-bg:#2c2c2e;--vseg-border:transparent;--vseg-ink:#98989f;--vseg-on-ink:#000;--vseg-pill:#fff;
    color-scheme:dark;
  }
  .sc-time .num{font-size:15px}.sc-w .num,.sc-ln .num,.sc-tick .num{font-size:15px}.sc-w .sc-wr.num{font-size:13.5px}
  #theme{display:none}
}
html,body{margin:0;background:var(--c-bg);color:var(--c-ink);font-family:var(--c-sans);-webkit-font-smoothing:antialiased}

/* Proven-sharps side card. Shared by both mocks; each page sets the --c-* skin tokens.
   Motion tokens and .vseg are inlined from vault-ds.css (sections 19 and 20) because standalone mocks cannot link it. */
:root{
  --ease-out:cubic-bezier(0.16,1,0.3,1);
  --ease-rail:cubic-bezier(0.65,0,0.35,1);
  --ease-spring:cubic-bezier(0.34,1.56,0.64,1);
  --dur-press:80ms; --dur-release:500ms; --dur-rail:400ms;
  --press-chip:.88; --press-btn:.94; --press-card:.975; --press-row:.99;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}

/* press primitive (vault-ds.css 19.1) */
.press{transition:transform var(--dur-release) var(--ease-spring)}
.press:active{transform:scale(var(--press-scale,.94));transition:transform var(--dur-press) ease-out}
.press-chip{--press-scale:var(--press-chip)}.press-card{--press-scale:var(--press-card)}

/* .vseg (vault-ds.css 20), retinted through the vars only */
.vseg{position:relative;display:inline-flex;align-items:center;flex-shrink:0;gap:2px;padding:3px;max-width:100%;
  background:var(--vseg-bg);border:1px solid var(--vseg-border);border-radius:9px}
.vseg>button{position:relative;z-index:1;display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:32px;padding:0 14px;
  border:0;background:transparent;border-radius:6px;color:var(--vseg-ink);font-family:var(--c-sans);font-size:12.5px;font-weight:600;
  letter-spacing:-.01em;white-space:nowrap;cursor:pointer;transition:color .12s ease}
.vseg>button.on{color:var(--vseg-on-ink)}
.vseg>button:disabled{opacity:.38;cursor:default}
.vseg.sm>button{min-height:26px;padding:0 10px;font-size:11.5px}
.vseg .v-pill{position:absolute;z-index:0;top:3px;bottom:3px;left:0;width:0;border-radius:6px;background:var(--vseg-pill);opacity:0;
  transition:left var(--dur-rail) var(--ease-rail),width var(--dur-rail) var(--ease-rail)}
.vseg.rail-noanim .v-pill{transition:none}
@media (max-width:767px){
  .vseg>button{min-height:36px}.vseg.sm>button{min-height:30px}
  .vseg>button::after{content:"";position:absolute;inset:-4px 0}
}

/* ── the card: a stack of modules ── */
.sc{background:var(--c-card);border:var(--c-bw,1px) solid var(--c-line);border-radius:var(--c-r);padding:var(--c-pad);color:var(--c-ink);
  font-family:var(--c-sans);font-size:14px;line-height:1.35;min-width:0;box-shadow:var(--c-shadow,none);display:flex;flex-direction:column;gap:10px}
.sc .num{font-family:var(--c-num);font-variant-numeric:tabular-nums;letter-spacing:var(--c-num-ls,0)}
.sc-body{display:flex;flex-direction:column;gap:10px}
.sc-cap{display:block;font-size:12px;font-weight:500;color:var(--c-mut)}
.sc-mod{background:var(--c-box);border-radius:var(--c-mr,16px);padding:16px;min-width:0}

.sc-top{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:2px 2px 4px}
.sc-match{font-size:19px;font-weight:600;letter-spacing:-.02em}
.sc-match i{font-style:normal;font-weight:400;color:var(--c-dim);font-size:.8em}
.sc-time{color:var(--c-mut);font-size:13px;margin-top:2px}
.sc-sport{color:var(--c-dim);font-weight:600;letter-spacing:.08em;font-size:11px;margin-right:8px}
.sc-pill{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 12px;border-radius:99px;font-size:12px;font-weight:600;white-space:nowrap;flex:none}
.sc-pill.live{color:var(--c-mut);background:var(--c-box)}
.sc-pill.live i{width:7px;height:7px;border-radius:50%;background:var(--c-warn);animation:sc-pulse 1.8s ease-in-out infinite}
.sc-pill.locked{background:var(--c-good);color:var(--c-on-good)}
.sc-pill svg{width:12px;height:12px}
@keyframes sc-pulse{50%{opacity:.25}}

.vseg.fluid{display:flex}.vseg.fluid>button{flex:1}
.sc-dotu{font-size:11px;font-weight:700;padding:1px 6px;border-radius:99px;background:var(--c-good);color:var(--c-on-good)}

/* verdict */
.sc-v.on{background:var(--c-good-box);box-shadow:inset 0 0 0 1px var(--c-good-line)}
.sc-v1{display:flex;align-items:center;gap:16px}
.sc-vu{font-size:56px;font-weight:700;letter-spacing:-.05em;line-height:.9;color:var(--c-good);flex:none}
.sc-vu small{font-size:.45em;font-weight:600;margin-left:1px;letter-spacing:0}
.sc-vu.zero{color:var(--c-dim)}
.sc-vt{flex:1;min-width:0}
.sc-vt strong{display:block;font-size:24px;font-weight:700;letter-spacing:-.03em;line-height:1.15;margin-top:1px}
.sc-v.off .sc-vt strong{color:var(--c-mut)}
.sc-vs{display:block;font-size:13.5px;color:var(--c-mut);margin-top:3px;line-height:1.4}
.sc-logo{width:48px;height:48px;border-radius:12px;background:var(--c-tile);display:grid;place-items:center;flex:none;overflow:hidden;font-weight:700;font-size:14px;color:var(--c-tile-ink)}
.sc-logo img{width:78%;height:78%;object-fit:contain}
.sc-logo.sm{width:24px;height:24px;border-radius:7px;font-size:10px}
.sc-ticks{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:14px;padding-top:12px;border-top:1px solid var(--c-line)}
.sc-tick{display:inline-flex;align-items:center;gap:5px;font-size:13px;color:var(--c-ink)}
.sc-tick svg{width:13px;height:13px;flex:none;color:var(--c-good)}.sc-tick.no svg{color:var(--c-bad)}
.sc-more{margin-top:10px;font-size:12.5px;color:var(--c-mut)}
.sc-more summary{cursor:pointer;list-style:none;color:var(--c-mut);font-weight:500;display:inline-flex;align-items:center;gap:5px}
.sc-more summary::-webkit-details-marker,.sc-dt summary::-webkit-details-marker{display:none}
.sc-more summary::after,.sc-dt summary::after{content:"";width:6px;height:6px;border-right:1.5px solid currentColor;border-bottom:1.5px solid currentColor;transform:rotate(45deg) translateY(-2px);transition:transform .2s var(--ease-out)}
.sc-more[open] summary::after,.sc-dt[open] summary::after{transform:rotate(225deg) translateY(-1px)}
.sc-more p{margin:7px 0 0;line-height:1.5}

/* money split: two side tiles and one balance bar */
.sc-split{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.sc-st.pk{box-shadow:inset 0 0 0 1px var(--c-good-line)}
.sc-sth{display:flex;align-items:center;gap:8px}
.sc-sth b{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sc-big{font-size:30px;font-weight:700;letter-spacing:-.03em;line-height:1.1;margin-top:10px}
.sc-lns{display:flex;flex-direction:column;gap:3px;margin-top:8px;min-height:20px}
.sc-ln{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--c-mut)}
.sc-ln b{font-weight:600;color:var(--c-ink)}
.sc-ln i{width:8px;height:8px;border-radius:50%;flex:none}
.sc-ln.hc i{background:var(--c-gold)}.sc-ln.sharp i{background:var(--c-good)}.sc-ln.loser i{background:var(--c-bad)}
.sc-ln.exc i{background:transparent;border:1.5px dashed var(--c-dim)}.sc-ln.exc b{color:var(--c-mut)}
.sc-ln.none{color:var(--c-dim)}
.sc-bar{grid-column:1 / -1;display:flex;align-items:center;height:8px}
.sc-bar>u{width:2px;height:14px;background:var(--c-ink);border-radius:1px;flex:none}
.sc-half{flex:1;display:flex;height:100%;gap:1px;min-width:0}
.sc-half.l{flex-direction:row-reverse}
.sc-half i{display:block;height:100%;flex:none}
.sc-half.l i:last-child{border-radius:4px 0 0 4px}.sc-half.r i:last-child{border-radius:0 4px 4px 0}
.sc-half .hc{background:var(--c-gold)}.sc-half .sharp{background:var(--c-good)}.sc-half .unp{background:var(--c-rb-unp)}.sc-half .loser{background:var(--c-bad)}
.sc-half .exc{background:repeating-linear-gradient(90deg,var(--c-dim) 0 2px,transparent 2px 4px)}

/* proven record */
.sc-kp{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:10px}
.sc-kp b{display:block;font-size:20px;font-weight:700;letter-spacing:-.02em;white-space:nowrap}
.sc-kp span{display:block;font-size:12px;color:var(--c-mut);margin-top:1px}
.sc-form{display:flex;align-items:center;gap:3px;height:16px;margin-top:12px}
.sc-form i{flex:1;max-width:14px;height:7px;border-radius:2px;background:var(--c-dim);align-self:center}
.sc-form i.W{background:var(--c-good);align-self:flex-start}.sc-form i.L{background:var(--c-bad);align-self:flex-end}
.sc-form span{font-size:12px;color:var(--c-mut);margin-left:8px;white-space:nowrap}

/* collapsed modules */
.sc-dt{padding:0}
.sc-dt summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:8px;padding:13px 16px;font-size:14px;font-weight:600}
.sc-dt summary em{font-style:normal;font-weight:500;color:var(--c-mut);font-size:13px;margin-right:auto}
.sc-dt summary::after{margin-left:auto;color:var(--c-mut)}
.sc-dt summary em+::after{margin-left:0}
.sc-dtb{padding:0 16px 14px}
.sc-dtb p{margin:0;font-size:12.5px;line-height:1.55;color:var(--c-mut)}
.sc-wg{margin-bottom:12px}
.sc-w{display:grid;grid-template-columns:14px 74px minmax(0,auto) minmax(0,1fr);gap:10px;align-items:center;min-height:34px;font-size:13px;border-top:1px solid var(--c-line)}
.sc-wg .sc-cap{margin-bottom:6px}
.sc-w b{font-weight:600;white-space:nowrap}
.sc-w.agg{grid-template-columns:14px minmax(0,1fr) auto}.sc-w.agg b{font-weight:500;color:var(--c-mut)}
.sc-wd{display:grid;place-items:center}.sc-wd i{width:8px;height:8px;border-radius:50%;background:var(--c-dim)}
.sc-wd svg{width:13px;height:13px;color:var(--c-gold)}
.sc-w.hc b{color:var(--c-gold)}.sc-w.sharp .sc-wd i{background:var(--c-good)}.sc-w.loser .sc-wd i{background:var(--c-bad)}
.sc-w.unp .sc-wd i{background:var(--c-rb-unp)}.sc-w.exc .sc-wd i{background:transparent;border:1.5px dashed var(--c-dim)}
.sc-wu{font-weight:600;white-space:nowrap}.sc-wu em{font-style:normal;font-weight:500;color:var(--c-mut);font-size:12px;margin-left:3px}
.sc-wr{font-size:12px;color:var(--c-mut);text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sc-hist{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-top:12px;border-top:1px solid var(--c-line)}

.sc-foot{margin:2px 2px 0;font-size:12px;color:var(--c-dim);line-height:1.5}
.sc-empty{text-align:center;padding:26px 16px}
.sc-empty b{display:block;font-size:16px;font-weight:600}
.sc-empty p{margin:6px auto 0;font-size:13.5px;color:var(--c-mut);max-width:34ch;line-height:1.45}

/* slate strip (page level) */
.sl{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:18px}
.sl-t{background:var(--c-card);border:var(--c-bw,1px) solid var(--c-line);border-radius:var(--c-r);padding:16px 18px;min-width:0}
.sl-t span{display:block;font-size:12.5px;font-weight:500;color:var(--c-mut)}
.sl-t b{display:block;font-size:30px;font-weight:700;letter-spacing:-.03em;margin-top:2px}
.sl-t.gold b{color:var(--c-gold)}.sl-t.good b{color:var(--c-good)}
.sl-t em{display:block;font-style:normal;font-size:12.5px;color:var(--c-mut)}
.sl-dots{display:flex;flex-wrap:wrap;gap:5px;margin:14px 0 9px}
.sl-dots i{width:10px;height:10px;border-radius:50%;background:var(--c-line2)}
.sl-dots i.signal{background:var(--c-good)}.sl-dots i.building{background:var(--c-warn)}

@media (max-width:767px){
  .sc{gap:8px}.sc-body{gap:8px}.sc-split{gap:8px}
  .sc-mod{padding:14px}
  .sc-match{font-size:17px}
  .sc-top{flex-wrap:wrap;gap:8px}.sc-time{white-space:nowrap}
  .sc-pill{height:26px;padding:0 10px;font-size:11.5px}
  .sc-vu{font-size:48px}.sc-vt strong{font-size:21px}.sc-v1{gap:12px}
  .sc-v.on .sc-logo{display:none}
  .sc-big{font-size:26px}
  .sc-kp{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 8px}
  .sc-w{grid-template-columns:14px 70px minmax(0,1fr);padding:6px 0}
  .sc-wr{grid-column:2 / -1;text-align:left}
  .sc-dt{padding:0}
  .sl{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:12px 16px 0}
  .sl-t{padding:12px 14px}.sl-t b{font-size:24px}.sl-t.clim{grid-column:1 / -1}
}
@media (prefers-reduced-motion:reduce){
  .press,.press:active{transition:none;transform:none}
  .vseg .v-pill,.sc-more summary::after,.sc-dt summary::after{transition:none}
  .sc-pill.live i{animation:none}
}

/* ── gallery chrome (mock only) ── */
.mk{max-width:1180px;margin:0 auto;padding:28px 24px 80px}
.mk-h{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:14px;margin-bottom:6px}
.mk-h h1{margin:0;font-size:24px;font-weight:700;letter-spacing:-.02em}
.mk-h p{margin:4px 0 0;color:var(--c-mut);font-size:13.5px;max-width:70ch}
.mk-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:30px 28px;margin-top:22px;align-items:start}
.mk-cell{min-width:0}
.mk-cap{margin:0 2px 9px;font-size:12px;color:var(--c-mut);line-height:1.4}
.mk-cap b{color:var(--c-ink);font-weight:600;font-size:13px;display:block}
body.single .mk-grid{grid-template-columns:minmax(0,560px);justify-content:center}
@media (max-width:900px){.mk-grid{grid-template-columns:minmax(0,1fr)}}
@media (max-width:767px){.mk{padding:14px 0 60px}.mk-h{padding:0 16px}.mk-h h1{font-size:20px}.mk-cap{margin:0 20px 8px}.mk-grid{gap:22px;margin-top:14px}
  .mk-cell .sc{margin:0 var(--c-gutter,12px)}}

</style></head>
<body>
<div class="mk">
  <div class="mk-h"><div><h1>Proven sharps side card · Sharp Money</h1><p>Game page card in Sharp Money's look. At desktop width it uses the classic page's palette; at phone width it uses the new/ layout. Every card is a real game from the live sample. Units appear only where the stored forward-test rule fires.</p></div>
    <div class="vseg sm" id="theme" aria-label="Theme"><i class="v-pill"></i><button type="button" data-v="dark">Dark</button><button type="button" data-v="light">Light</button></div></div>
  <div class="sl" id="slate"></div>

function walletRow(w, k){
  return '<div class="sc-w ' + k + '"><span class="sc-wd">' + (w.star ? ICON.star : '<i></i>') + '</span><b class="num">' + tail(w.w) + '</b>' +
    '<span class="sc-wu num">' + usd(w.usd) + (w.press != null ? ' <em>' + w.press + 'x</em>' : '') + '</span>' +
    '<span class="sc-wr num">' + w.w_ + '-' + w.l_ + ' · L30 ' + roi(w.l30_roi) + ' · ' + susd(w.pnl) + '</span></div>';
}
function walletList(n, s){
  var sum = function(a){ return a.reduce(function(t, x){ return t + x.usd; }, 0); }, c = s.counts, np = nProven(s), h = '<div class="sc-wg"><span class="sc-cap">' + esc(n) + '</span>';
  var agg = function(k, t, v){ return '<div class="sc-w agg ' + k + '"><span class="sc-wd"><i></i></span><b>' + t + '</b><span class="sc-wu num">' + usd(v) + '</span></div>'; };
  s.list.forEach(function(w){ h += walletRow(w, w.star ? 'hc' : 'sharp'); });
  if (np > s.list.length) h += agg('sharp', '+' + (np - s.list.length) + ' more proven', Math.max(0, s.sharp_usd - sum(s.list)));
  s.losers.forEach(function(w){ h += walletRow(w, 'loser'); });
  if (c.loser > s.losers.length) h += agg('loser', '+' + (c.loser - s.losers.length) + ' more losers', Math.max(0, s.loser_usd - sum(s.losers)));
  if (c.unproven) h += agg('unp', c.unproven + ' unproven', s.unproven_usd);
  if (c.excluded) h += agg('exc', c.excluded + ' excluded, not counted', s.excluded_usd);
  if (!(np + c.loser + c.unproven + c.excluded)) h += '<div class="sc-w agg exc"><span class="sc-wd"><i></i></span><b>No holders at $250 or more</b></div>';
  return h + '</div>';
}
function body(g, st){
  var m = g.markets[st.group], names = sideOrder(g, m, st.group), v = st.variant, ls = shadow(m, v);
  var a = m.sides[names[0]][v], b = m.sides[names[1]][v], max = Math.max(counted(a) + a.excluded_usd, counted(b) + b.excluded_usd) || 1;
  var h = verdict(g, m, st.group, names, v);
  h += '<div class="sc-split">' + sideTile(g, names[0], a, ls && ls.side === names[0]) + sideTile(g, names[1], b, ls && ls.side === names[1]) +
    '<div class="sc-bar">' + half(a, max, 'l') + '<u></u>' + half(b, max, 'r') + '</div></div>';
  var best = names.slice().sort(function(x, y){ return m.sides[y][v].sharp_usd - m.sides[x][v].sharp_usd; })[0], p = m.sides[best][v].proven;
  if (p.wallets){
    h += '<section class="sc-mod sc-pr"><span class="sc-cap">Proven wallets on ' + esc(best) + ' · ' + p.wallets + '</span><div class="sc-kp">' +
      '<div><b class="num">' + (p.win_pct == null ? 'n/a' : p.win_pct + '%') + '</b><span>win</span></div><div><b class="num">' + p.w + '-' + p.l + '</b><span>record</span></div>' +
      '<div><b class="num">' + roi(p.l30_roi) + '</b><span>last 30 days</span></div><div><b class="num">' + susd(p.lifetime_pnl) + '</b><span>lifetime</span></div></div>' +
      (p.last20.length ? '<div class="sc-form">' + p.last20.map(function(r){ return '<i class="' + r + '"></i>'; }).join('') + '<span>last ' + p.last20.length + '</span></div>' : '') + '</section>';
  }
  var nW = names.reduce(function(t, n){ var c = m.sides[n][v].counts; return t + c.hc + c.sharp + c.unproven + c.loser + c.excluded; }, 0);
  h += '<details class="sc-mod sc-dt" data-d="w"' + (st.open.w ? ' open' : '') + '><summary>Wallets<em class="num">' + nW + '</em></summary><div class="sc-dtb">' +
    names.map(function(n){ return walletList(n, m.sides[n][v]); }).join('') +
    '<div class="sc-hist"><span class="sc-cap">Wallet history</span><div class="vseg sm" data-k="variant"><i class="v-pill"></i><button type="button" data-v="all"' + (v === 'all' ? ' class="on"' : '') +
    '>All</button><button type="button" data-v="fwd"' + (v === 'fwd' ? ' class="on"' : '') + '>Forward only</button></div></div></div></details>';
  var cv = g.coverage, bits = ['Money is mark value ' + (g.frozen ? 'at the lock' : 'now') + ' (shares x price), not cost.',
    cv.markets_read + ' markets read, ' + cv.markets_missed + ' missed' + (cv.late_reads ? ', ' + cv.late_reads + ' late' : '') + '.',
    'Oldest read ' + dur(cv.max_read_lag_s) + ' before ' + (g.frozen ? 'the lock' : 'this build') + '.', 'Ledger refreshed ' + ct(g.ledger_run_at) + ' CT.'];
  if (cv.two_way_dust_dropped) bits.push(cv.two_way_dust_dropped + ' two-way ' + (cv.two_way_dust_dropped === 1 ? 'wallet' : 'wallets') + ' dropped as balanced dust.');
  if (g.vault.start_gap_flag) bits.push('Start times differ by ' + g.vault.start_gap_min + ' min between Polymarket and Vault.');
  if (g.test) bits.push(g.test.counts ? 'Counts for the forward test.' : 'Does not count for the forward test: ' + g.test.why_not.join(', ') + '.');
  return h + '<details class="sc-mod sc-dt" data-d="n"' + (st.open.n ? ' open' : '') + '><summary>Data notes</summary><div class="sc-dtb"><p>' + bits.join(' ') + '</p></div></details>' +
    '<p class="sc-foot">Sharp money is context. Units come from a rule still in its forward test.</p>';
}

function rail(strip, animate){
  var on = strip.querySelector('button.on'), pill = strip.querySelector('.v-pill');
  if (!on || !pill || !strip.offsetWidth) return;
  if (!animate || pill.style.opacity !== '1'){ strip.classList.add('rail-noanim'); }
  pill.style.left = on.offsetLeft + 'px'; pill.style.width = on.offsetWidth + 'px'; pill.style.opacity = '1';
  void pill.offsetWidth; strip.classList.remove('rail-noanim');
}

function mount(el, g, opt){
  opt = opt || {};
  var keys = GROUPS.filter(function(x){ return g.markets[x[0]]; }).map(function(x){ return x[0]; });
  var st = {group: keys.indexOf(opt.group) >= 0 ? opt.group : keys[0], variant: 'all', open: {}};
  var away = TEAMS[g.vault.away], home = TEAMS[g.vault.home];
  var head = '<div class="sc-top"><div><div class="sc-match">' + esc(away ? away[0] : g.vault.away) + ' <i>at</i> ' + esc(home ? home[0] : g.vault.home) + '</div>' +
    '<div class="sc-time"><span class="sc-sport">' + g.sport.toUpperCase() + '</span><span class="num">' + ct(g.gst, true) + ' CT</span></div></div>' +
    (g.frozen ? '<div class="sc-pill locked">' + ICON.lock + 'Locked ' + ct(g.cut) + '</div>' : '<div class="sc-pill live"><i></i>Live · locks ' + ct(g.cut) + '</div>') + '</div>';
  if (!keys.length){
    el.innerHTML = head + '<div class="sc-mod sc-empty"><b>Nothing to show yet</b><p>No wallet holds $250 or more on this game. The card fills in as money arrives and locks ' + ct(g.cut, true) + ' CT.</p></div>';
    return;
  }
  function strip(){
    return GROUPS.map(function(x){ var m = g.markets[x[0]], ls = m && shadow(m, st.variant);
      return '<button type="button" data-v="' + x[0] + '"' + (m ? '' : ' disabled') + (x[0] === st.group ? ' class="on"' : '') + '>' + x[1] + (ls ? '<span class="sc-dotu num">' + ls.units_clean_ladder + 'u</span>' : '') + '</button>'; }).join('');
  }
  el.innerHTML = head + '<div class="vseg fluid" data-k="group" role="tablist" aria-label="Market"><i class="v-pill"></i>' + strip() + '</div><div class="sc-body"></div>';
  var bodyEl = el.querySelector('.sc-body'), top = el.querySelector('.vseg[data-k=group]');
  function paint(){ bodyEl.innerHTML = body(g, st); var h = bodyEl.querySelector('.vseg'); if (h && h.offsetWidth) rail(h, false); }
  paint(); rail(top, false);
  el.addEventListener('toggle', function(e){ var d = e.target; if (d.dataset && d.dataset.d){ st.open[d.dataset.d] = d.open; var h = d.querySelector('.vseg'); if (h && d.open) rail(h, false); } }, true);
  el.addEventListener('click', function(e){
    var b = e.target.closest('.vseg > button');
    if (!b || b.disabled) return;
    var s = b.parentNode; st[s.dataset.k] = b.dataset.v;
    if (s === top){ [].forEach.call(s.children, function(c){ c.classList.toggle('on', c === b); }); rail(s, true); paint(); }
    else { top.innerHTML = '<i class="v-pill"></i>' + strip(); rail(top, false); paint(); }
  });
  el._repaint = function(){ paint(); rail(top, false); };
}

/* slate strip: totals over every game in the file, stored fields only */
function slate(el, data){
  var usdSum = 0, sides = 0, wallets = {}, cl = {quiet:0, building:0, signal:0}, plays = 0, ex = 0;
  data.games.forEach(function(g){
    cl[climate(g, 'all')]++;
    Object.keys(g.markets).forEach(function(k){ var m = g.markets[k]; if (shadow(m, 'all')) plays++;
      Object.keys(m.sides).forEach(function(n){ var s = m.sides[n].all; usdSum += s.sharp_usd; ex += s.excluded_usd; if (s.sharp_usd > 0) sides++;
        s.list.forEach(function(w){ wallets[w.w] = 1; }); }); });
  });
  var t = function(v, l, sub, cls){ return '<div class="sl-t ' + (cls || '') + '"><span>' + l + '</span><b class="num">' + v + '</b><em>' + sub + '</em></div>'; };
  el.innerHTML = t(plays, 'Suggested plays', 'of ' + data.games.length + ' games', 'good') +
    t(usd(usdSum), 'Proven money', sides + ' sides, ' + Object.keys(wallets).length + ' wallets', 'gold') +
    '<div class="sl-t clim"><span>Climate</span><div class="sl-dots">' +
      ['signal', 'building', 'quiet'].map(function(k){ return new Array(cl[k] + 1).join('<i class="' + k + '"></i>'); }).join('') + '</div><em>' +
      cl.signal + ' signal · ' + cl.building + ' building · ' + cl.quiet + ' quiet</em></div>';
}

window.SideCard = {mount: mount, slate: slate};
})();

/* Mock gallery: every state is a real game from the sample. ?state=<id> shows one card. */
(function(){
var STATES = [
  {id:'proven',   ev:'nba-was-ind-2026-11-11', g:'ml',     cap:'Proven money, no play', note:'A proven wallet is on Wizards, but the side holds under 60% of the money, so the rule suggests nothing.'},
  {id:'star',     ev:'nba-den-mem-2026-11-11', g:'spread', cap:'Suggested units (the one play in the sample)', note:'Nuggets spread clears all four gates. One number, the side, the price and four ticks.'},
  {id:'total',    ev:'nba-den-mem-2026-11-11', g:'total',  cap:'Total selected', note:'Proven money on the Over without a play. The Spread tab carries its 3u badge.'},
  {id:'none',     ev:'nba-gsw-hou-2026-11-11', g:'ml',     cap:'No proven money (the common case today)', note:'The verdict says why in one line. The two side tiles still show where the money sits.'},
  {id:'losers',   ev:'nba-bos-tor-2026-11-11', g:'ml',     cap:'Loser-heavy side', note:'Five loser wallets on Celtics, one proven wallet on Raptors.'},
  {id:'excluded', ev:'nba-orl-uta-2026-11-11', g:'spread', cap:'Excluded-heavy side', note:'Most of the Magic spread money is excluded. It is listed apart and never counted.'},
  {id:'frozen',   ev:'nba-cle-nyk-2026-11-11', g:'spread', frozen:1, cap:'Frozen at the lock', note:'Real card data. The sample has no frozen card yet, so the mock sets the frozen flag to show the locked state.'},
  {id:'thin',     ev:'nba-okc-lac-2026-11-13', g:'ml',     cap:'Two days out, thin money', note:'Only the moneyline has been read. Spread and Total are disabled.'},
  {id:'empty',    ev:'nba-mil-orl-2026-11-13', g:'ml',     cap:'Nothing read yet', note:'A game with no holders at $250 or more.'}
];
var q = new URLSearchParams(location.search), one = q.get('state'), th = q.get('theme');
if (th) document.documentElement.dataset.theme = th;
if (one) document.body.classList.add('single');
var grid = document.getElementById('grid'), cards = [];
STATES.forEach(function(s){
  if (one && one !== s.id) return;
  var g = JSON.parse(JSON.stringify(SIDE_SAMPLE.games.filter(function(x){ return x.ev === s.ev; })[0]));
  if (s.frozen){ g.frozen = true; }
  var cell = document.createElement('div'); cell.className = 'mk-cell'; cell.id = s.id;
  cell.innerHTML = '<p class="mk-cap"><b>' + s.cap + '</b>' + s.note + '</p><div class="sc"></div>';
  grid.appendChild(cell); SideCard.mount(cell.lastChild, g, {group: s.g}); cards.push(cell.lastChild);
});
var sl = document.getElementById('slate'); if (sl && !one) SideCard.slate(sl, SIDE_SAMPLE);
if (q.get('open')) [].forEach.call(document.querySelectorAll('details.sc-dt'), function(d){ d.open = true; });
var tseg = document.getElementById('theme');
if (tseg){
  var cur = document.documentElement.dataset.theme || 'dark';
  [].forEach.call(tseg.querySelectorAll('button'), function(b){ b.classList.toggle('on', b.dataset.v === cur);
    b.onclick = function(){ document.documentElement.dataset.theme = b.dataset.v;
      [].forEach.call(tseg.querySelectorAll('button'), function(c){ c.classList.toggle('on', c === b); }); place(true); }; });
  var place = function(anim){ var on = tseg.querySelector('.on'), p = tseg.querySelector('.v-pill'); if (!anim) tseg.classList.add('rail-noanim');
    p.style.left = on.offsetLeft + 'px'; p.style.width = on.offsetWidth + 'px'; p.style.opacity = '1'; void p.offsetWidth; tseg.classList.remove('rail-noanim'); };
  place(false);
}
var mq = matchMedia('(max-width:767px)'), rp = function(){ cards.forEach(function(c){ c._repaint && c._repaint(); }); };
mq.addEventListener ? mq.addEventListener('change', rp) : mq.addListener(rp);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(rp);
})();

</script>
