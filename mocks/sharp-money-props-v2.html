<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sharp Money — Props v2 (concept)</title>
<style>
  :root{
    --bg:#0e0f13;--s1:#16171c;--s2:#1c1e24;--s3:#23252c;--s4:#2c2f38;
    --bd:rgba(255,255,255,.08);--fg:#f3f4f7;--fg2:#c9cdd6;--mut:#7e8493;
    --acc:#8fb4e0;--good:#5fe09a;--bad:#ff5a6e;--warn:#f5c842;
    --qb:#ff6680;--rb:#3dcc7a;--wr:#7bd0ff;--te:#f5c842;
    --sans:system-ui,-apple-system,'Segoe UI',sans-serif;--mono:ui-monospace,'SF Mono',Menlo,monospace;
  }
  *{box-sizing:border-box;margin:0;scrollbar-width:none}*::-webkit-scrollbar{display:none}
  body{background:var(--bg);color:var(--fg);font:13px/1.45 var(--sans);min-height:100vh}
  .k{font:700 10px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--mut)}
  .mono{font-family:var(--mono)}.g{color:var(--good)}.r{color:var(--bad)}.m{color:var(--mut)}
  .app{display:grid;grid-template-columns:56px minmax(0,1fr);min-height:100vh}
  .rail{border-right:1px solid var(--bd);padding:16px 8px;display:flex;flex-direction:column;gap:10px;align-items:center}
  .rail i{width:36px;height:36px;border-radius:9px;display:grid;place-items:center;color:var(--mut);font-style:normal;font-size:15px}
  .rail i.on{background:var(--s3);color:var(--fg)}
  .logo{width:32px;height:32px;border-radius:8px;background:var(--fg);color:var(--bg);display:grid;place-items:center;font:800 11px var(--mono);margin-bottom:8px}
  header{display:flex;align-items:center;gap:14px;padding:14px 24px;border-bottom:1px solid var(--bd)}
  header h1{font-size:16px;font-weight:700}
  .chip{display:inline-flex;gap:6px;align-items:center;padding:4px 10px;border-radius:999px;background:var(--s2);border:1px solid var(--bd);font:600 10px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--fg2)}
  .dot{width:6px;height:6px;border-radius:50%;background:var(--good)}.dot.o{background:var(--bad)}
  .seg{display:inline-flex;background:var(--s2);border:1px solid var(--bd);border-radius:999px;padding:3px}
  .seg b{font-weight:600;font-size:12px;padding:5px 12px;border-radius:999px;color:var(--mut);cursor:pointer}
  .seg b.on{background:var(--fg);color:var(--bg)}
  .sp{flex:1}
  /* tracker strip */
  .trk{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:1px;background:var(--bd);border-bottom:1px solid var(--bd)}
  .trk>div{background:var(--bg);padding:12px 16px}
  .trk .v{font:700 20px var(--mono);margin:2px 0}.trk .d{font-size:11px;color:var(--mut)}
  .meter{height:3px;background:var(--s3);border-radius:2px;margin-top:8px}.meter i{display:block;height:100%;background:var(--good);border-radius:2px}
  .work{display:grid;grid-template-columns:minmax(420px,480px) minmax(0,1fr) 380px;height:calc(100vh - 53px - 100px)}
  .pane{overflow:auto;border-right:1px solid var(--bd)}.pane:last-child{border-right:0}
  .ph{position:sticky;top:0;z-index:2;background:var(--bg);padding:12px 16px;border-bottom:1px solid var(--bd);display:grid;gap:10px}
  .ph .row1{display:flex;align-items:center;gap:10px}
  input{background:var(--s2);border:1px solid var(--bd);border-radius:999px;color:var(--fg);padding:6px 12px;font:12px var(--sans);width:150px;outline:none}
  .pills{display:flex;gap:6px;flex-wrap:wrap}
  .pl{padding:4px 11px;border-radius:999px;background:var(--s2);border:1px solid var(--bd);font-size:11px;font-weight:600;color:var(--mut);cursor:pointer}
  .pl.on{background:var(--fg);color:var(--bg)}
  /* photos */
  .ph-av{position:relative;flex:none;border-radius:50%;overflow:hidden;background:var(--s3);display:grid;place-items:center;font:800 13px var(--mono);color:var(--bg)}
  .ph-av img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 12%}
  .QB{background:var(--qb)}.RB{background:var(--rb)}.WR{background:var(--wr)}.TE{background:var(--te)}
  .ring{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--c)}
  /* list rows */
  .row{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--bd);cursor:pointer}
  .row:hover{background:var(--s1)}.row.on{background:var(--s2);box-shadow:inset 3px 0 var(--acc)}
  .row .n{font-weight:700;font-size:14px;display:flex;gap:8px;align-items:center}
  .row .s{color:var(--mut);font-size:11px;margin-top:1px}
  .row .pick{font:600 12px var(--mono);color:var(--fg2);margin-top:4px}
  .row .e{text-align:right}.row .e b{font:800 17px var(--mono);color:var(--warn);display:block}
  .st{display:inline-block;font:700 9px var(--mono);letter-spacing:.08em;padding:2px 6px;border-radius:5px;margin-top:4px}
  .st.open{background:var(--s3);color:var(--fg2)}.st.up{background:rgba(95,224,154,.14);color:var(--good)}.st.dn{background:rgba(255,90,110,.14);color:var(--bad)}.st.old{background:rgba(245,200,66,.14);color:var(--warn)}
  .star{cursor:pointer;color:var(--mut);font-size:15px;line-height:1}.star.on{color:var(--warn)}
  /* centre */
  .center{padding:22px 26px;display:grid;gap:16px;align-content:start}
  .hd{display:flex;gap:18px;align-items:center}
  .hd h2{font-size:26px;font-weight:800;line-height:1.1}
  .hd .sub{color:var(--mut);margin-top:3px}
  .hd .big{margin-left:auto;text-align:right}.hd .big b{display:block;font:800 30px var(--mono);color:var(--warn)}
  .play{font:700 20px var(--sans)}
  .card{background:var(--s1);border:1px solid var(--bd);border-radius:12px;padding:16px}
  .card h4{margin-bottom:12px}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  /* price ladder */
  .lad{display:grid;grid-template-columns:120px 1fr 74px 64px;gap:10px;align-items:center;padding:7px 0;border-top:1px solid var(--bd)}
  .lad:first-of-type{border-top:0}
  .lad .nm{font-weight:600;font-size:12px}.lad .nm small{display:block;color:var(--mut);font-weight:500;font-size:10px}
  .track{position:relative;height:6px;background:var(--s3);border-radius:3px}
  .track .fill{position:absolute;left:0;top:0;height:100%;border-radius:3px;background:var(--acc)}
  .track .fair{position:absolute;top:-4px;width:2px;height:14px;background:var(--fg)}
  .lad .px{font:700 12px var(--mono);text-align:right}.lad .ev{font:700 11px var(--mono);text-align:right}
  .lad.me{background:rgba(143,180,224,.07);border-radius:8px;padding-left:8px;padding-right:8px;margin:0 -8px}
  /* tracking timeline */
  .tl{display:grid;grid-template-columns:repeat(5,1fr);position:relative;margin-top:4px}
  .tl::before{content:'';position:absolute;left:10%;right:10%;top:9px;height:2px;background:var(--s4)}
  .tl>div{position:relative;text-align:center;font-size:11px;color:var(--mut)}
  .tl i{display:block;width:12px;height:12px;border-radius:50%;background:var(--s4);margin:3px auto 8px;border:2px solid var(--s1);position:relative;z-index:1}
  .tl .done i{background:var(--acc)}.tl .now i{background:var(--warn);box-shadow:0 0 0 4px rgba(245,200,66,.18)}
  .tl b{display:block;color:var(--fg);font:700 12px var(--mono);margin-top:2px}
  .tl .lab{color:var(--fg2);font-weight:600}
  .clvbox{display:flex;gap:24px;margin-top:16px;padding-top:14px;border-top:1px solid var(--bd)}
  .clvbox div b{display:block;font:800 18px var(--mono)}
  /* right rail */
  .tabs{display:inline-flex;background:var(--s2);border:1px solid var(--bd);border-radius:999px;padding:3px}
  .tabs b{font-size:11px;font-weight:600;padding:4px 11px;border-radius:999px;color:var(--mut);cursor:pointer}.tabs b.on{background:var(--fg);color:var(--bg)}
  .tk{display:grid;grid-template-columns:36px 1fr auto;gap:10px;align-items:center;padding:11px 16px;border-bottom:1px solid var(--bd)}
  .tk .n{font-weight:700}.tk .s{font-size:11px;color:var(--mut)}
  .tk .r2{text-align:right;font:700 12px var(--mono)}
  table{width:100%;border-collapse:collapse}
  th{text-align:left;font:700 9px var(--mono);letter-spacing:.08em;color:var(--mut);text-transform:uppercase;padding:8px 10px}
  td{padding:8px 10px;border-top:1px solid var(--bd);font:500 11px var(--mono)}
  td:first-child{font-family:var(--sans);font-weight:600;font-size:12px}
  .sec{padding:12px 16px 4px}
  .bucket{display:grid;grid-template-columns:70px 1fr 56px;gap:10px;align-items:center;padding:8px 16px;font-size:11px}
  .note{position:fixed;right:16px;bottom:12px;font:600 10px var(--mono);color:var(--mut);background:var(--s2);border:1px solid var(--bd);padding:6px 10px;border-radius:8px;z-index:9}
</style>
</head>
